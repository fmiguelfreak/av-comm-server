<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AV-COMM | Show Setup Configuration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    // DOM Elements
    const countDisplay = document.getElementById('channel-count');
    const decrementBtn = document.getElementById('decrement-channels');
    const incrementBtn = document.getElementById('increment-channels');
    const showIdDisplay = document.getElementById('display-show-id');
    const pinDisplay = document.getElementById('display-access-pin');
    const roleButtons = document.querySelectorAll('.role-btn');
    const launchCta = document.getElementById('launch-cta');

    // Initial State
    let channels = 16;
    let selectedRole = 'FOH';

    // 1. Generation Logic on Load
    window.addEventListener('DOMContentLoaded', () => {
        // Generate random 4-digit ID suffix
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const showId = `XC-${randomNum}`;
        
        // Generate random 4-digit PIN
        const pin = Math.floor(1000 + Math.random() * 9000).toString();

        // Store in sessionStorage
        sessionStorage.setItem('stage_tech_show_id', showId);
        sessionStorage.setItem('stage_tech_pin', pin);

        // Update UI
        showIdDisplay.textContent = showId;
        pinDisplay.textContent = pin;
    });

    // 2. Channel Allocation Counter Logic
    const updateDisplay = () => {
        countDisplay.textContent = channels;
    };

    decrementBtn.addEventListener('click', () => {
        if (channels > 1) {
            channels--;
            updateDisplay();
        }
    });

    incrementBtn.addEventListener('click', () => {
        if (channels < 24) {
            channels++;
            updateDisplay();
        }
    });

    // 3. Role Selection Logic
    roleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            roleButtons.forEach(b => b.classList.remove('role-active'));
            btn.classList.add('role-active');
            selectedRole = btn.getAttribute('data-role');
        });
    });

    // 4. Initialize Uplink (Save and Redirect)
    launchCta.addEventListener('click', () => {
        // Save configuration to sessionStorage
        sessionStorage.setItem('stage_tech_channels', channels);
        sessionStorage.setItem('stage_tech_role', selectedRole);
        
        // Navigate to grid screen
        window.location.href = `grid.html`;
    });

    // Visual Pulse Effect
    setInterval(() => {
        launchCta.style.boxShadow = `0 10px 40px rgba(0,255,65,${0.2 + Math.random() * 0.15})`;
    }, 1000);
</script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #131313;
        color: #e5e2e1;
        overflow-x: hidden;
      }
      .grid-pattern {
        background-image: linear-gradient(#1c1b1b 1px, transparent 1px), linear-gradient(90deg, #1c1b1b 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .role-active {
        background-color: #00ff41 !important;
        color: #003907 !important;
        box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
      }
      .role-active .material-symbols-outlined {
        color: inherit;
      }
    </style>
</head>

<span class="font-label font-black text-[10px] tracking-tighter">FOH</span>
</button>

<span class="material-symbols-outlined text-3xl mb-2" data-icon="mic">mic</span>

<span class="material-symbols-outlined text-3xl mb-2" data-icon="dashboard_customize">dashboard_customize</span>
<span class="font-label font-black text-[10px] tracking-tighter">CUSTOM</span>
</button>
</div>
</div>
</div>
</div>
<!-- Start Session Button -->
<div class="w-full max-w-4xl mt-8">
<button class="w-full py-8 bg-primary-container text-on-primary-container font-headline font-black text-2xl tracking-[0.3em] uppercase flex items-center justify-center gap-4 hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_10px_40px_rgba(0,255,65,0.2)]" id="launch-cta">
<span class="material-symbols-outlined text-4xl" data-icon="bolt" data-weight="fill">bolt</span>
            INITIALIZE UPLINK
        </button>
<div class="flex justify-between mt-4">
<p class="font-label text-[9px] text-outline-variant tracking-widest uppercase">Encryption: 256-bit AES Tactical</p>
<p class="font-label text-[9px] text-outline-variant tracking-widest uppercase">Node: US-EAST-01</p>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full h-20 z-50 flex justify-around items-center px-4 pb-2 bg-[#0e0e0e] border-t-2 border-[#1c1b1b]">
<a class="flex flex-col items-center justify-center bg-[#00FF41] text-[#007117] rounded-sm px-6 py-2 shadow-[0_0_15px_rgba(0,255,65,0.4)] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter mt-1">CONFIG</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2a2a2a] hover:text-[#00FF41] px-6 py-2 hover:bg-[#1c1b1b] transition-all active:bg-[#72ff70] active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter mt-1">PTT</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2a2a2a] hover:text-[#00FF41] px-6 py-2 hover:bg-[#1c1b1b] transition-all active:bg-[#72ff70] active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>

</nav>

<div class="flex flex-col gap-1">
<div class="w-1 h-12 bg-primary-container/20"></div>
<div class="w-1 h-4 bg-primary-container"></div>
<div class="w-1 h-1 bg-primary-container"></div>
</div>
</div>
<div class="fixed bottom-24 right-6 hidden xl:block">

<p class="font-label text-[8px] text-primary-container uppercase mt-2 rotate-90 origin-right">v2.4.0-stable</p>
