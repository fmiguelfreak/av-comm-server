<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CONFIG</title>
</head>

<body style="background:#111;color:white;font-family:sans-serif;text-align:center;padding:40px">

<h2>ROOM CRIADA</h2>

<p id="room"></p>
<p id="pin"></p>

<button onclick="go()">ENTRAR NA GRID</button>

<script>
const data = JSON.parse(localStorage.getItem('av_session'));

document.getElementById('room').innerText = "ROOM: " + data.roomID;
document.getElementById('pin').innerText = "PIN: " + data.pin;

function go() {
    window.location.href = "grid.html";
}
</script>

</body>
</html>
