<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM | Show Setup Configuration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #000000;
            color: #e5e2e1;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .grid-pattern {
            background-image: linear-gradient(#151515 1px, transparent 1px), linear-gradient(90deg, #151515 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .role-active {
            background-color: #00ff41 !important;
            color: #000000 !important;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.4);
            border: 2px solid #00ff41;
        }
        .role-active .material-symbols-outlined {
            color: inherit;
        }
        .tactical-border {
            border: 1px solid #333;
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        input:focus { outline: none; border-color: #00FF41 !important; box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        /* Allow the original controls to remain reachable on short screens. */
        main { overflow-y: auto !important; }
    </style>
</head>
<body class="font-body flex flex-col">
<header class="flex justify-between items-center px-6 h-16 w-full z-50 bg-black border-b-2 border-[#00FF41] shrink-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF41] status-pulse" data-icon="sensors">sensors</span>
<span class="font-headline font-bold tracking-tighter text-[#00FF41] text-lg uppercase">Stage_Tech_Auth</span>
</div>
<div class="flex items-center gap-6">
<span class="font-headline uppercase tracking-widest text-[10px] text-[#00FF41]">System_Ready</span>
<button class="material-symbols-outlined text-[#00FF41] hover:bg-zinc-900 p-2 rounded active:scale-95 transition-all" onclick="window.location.reload()">sync</button>
</div>
</header>
<main class="flex-1 grid-pattern flex flex-col items-center justify-between px-4 pt-6 pb-24 overflow-hidden relative">
<!-- Configuration IDs -->
<div class="w-full max-w-md flex flex-col gap-3 shrink-0">
<div class="bg-[#0a0a0a] border-l-4 border-[#00FF41] p-5 flex justify-between items-center tactical-border">
<div>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-1">Generated Show ID</p>
<h2 class="font-headline text-4xl font-bold text-[#00FF41] tracking-tighter"><span id="display-show-id">----</span></h2>
</div>
<span class="material-symbols-outlined text-zinc-800 text-4xl">qr_code_2</span>
</div>
<div class="bg-[#0a0a0a] border-l-4 border-[#00FF41] p-5 flex justify-between items-center tactical-border">
<div>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-1">Access PIN</p>
<h2 class="font-headline text-4xl font-bold text-[#00FF41] tracking-widest"><span id="display-access-pin">----</span></h2>
</div>
<span class="material-symbols-outlined text-zinc-800 text-4xl">lock</span>
</div>
</div>
<!-- Configuration Inputs -->
<div class="w-full max-w-md flex flex-col gap-4 flex-1 justify-center py-4">
<!-- Channel Count -->
<div class="bg-[#0a0a0a] p-4 flex flex-col gap-3 border-t-2 border-[#00FF41] tactical-border">
<label class="font-label text-[10px] uppercase tracking-widest text-[#00FF41]">01_CHANNEL_ALLOCATION</label>
<div class="flex items-center gap-4 w-full">
<button class="bg-zinc-900 text-white hover:bg-zinc-800 w-14 h-14 flex items-center justify-center transition-all active:scale-90 border border-zinc-800" id="decrement-channels">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex-1 bg-black p-4 text-center border-b-2 border-[#00FF41]">
<span class="font-headline text-5xl font-bold text-[#00FF41]" id="channel-count">12</span>
<span class="font-label text-[10px] text-zinc-500 block uppercase tracking-widest mt-1">Units</span>
</div>
<button class="bg-zinc-900 text-white hover:bg-zinc-800 w-14 h-14 flex items-center justify-center transition-all active:scale-90 border border-zinc-800" id="increment-channels">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Role Selection -->
<div class="bg-[#0a0a0a] p-4 flex flex-col gap-4 tactical-border">
<label class="font-label text-[10px] uppercase tracking-widest text-[#00FF41]">02_OPERATIONAL_ROLE</label>
<div class="grid grid-cols-4 gap-2" id="role-grid">
<button class="role-btn role-active flex flex-col items-center justify-center p-3 bg-zinc-900 text-zinc-500 transition-all border border-transparent" data-role="FOH">
<span class="material-symbols-outlined text-2xl mb-1">settings_input_component</span>
<span class="font-label font-bold text-[8px] tracking-widest">FOH</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-3 bg-zinc-900 text-zinc-500 transition-all border border-transparent" data-role="BOH">
<span class="material-symbols-outlined text-2xl mb-1">terminal</span>
<span class="font-label font-bold text-[8px] tracking-widest">BOH</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-3 bg-zinc-900 text-zinc-500 transition-all border border-transparent" data-role="MICS">
<span class="material-symbols-outlined text-2xl mb-1">mic</span>
<span class="font-label font-bold text-[8px] tracking-widest">MICS</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-3 bg-zinc-900 text-zinc-500 transition-all border border-transparent" data-role="CUSTOM">
<span class="material-symbols-outlined text-2xl mb-1">dashboard_customize</span>
<span class="font-label font-bold text-[8px] tracking-widest">CUSTOM</span>
</button>
</div>
<!-- Custom Role Input -->
<div class="hidden animate-in fade-in duration-300" id="custom-role-container">
<input class="w-full bg-black border border-zinc-800 text-[#00FF41] font-mono text-xs p-3 tracking-widest uppercase focus:border-[#00FF41]" id="custom-role-input" placeholder="SPECIFY ROLE NAME..." type="text"/>
</div>
</div>
</div>
<!-- Start Session -->
<div class="w-full max-w-md shrink-0">
<button class="w-full py-6 bg-[#00FF41] text-black font-headline font-black text-xl tracking-[0.25em] uppercase flex items-center justify-center gap-4 hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_15px_50px_rgba(0,255,65,0.2)] disabled:opacity-50" id="launch-cta">
<span class="material-symbols-outlined text-3xl font-bold">bolt</span>
                INITIALIZE UPLINK
            </button>
<div class="flex justify-between mt-3 px-1">
<p class="font-label text-[8px] text-zinc-600 tracking-[0.2em] uppercase">Protocol: AES-GCM Tactical</p>
<p class="font-label text-[8px] text-zinc-600 tracking-[0.2em] uppercase">Status: <span class="text-zinc-500" id="socket-status">OFFLINE</span></p>
</div>
</div>
</main>
<nav class="fixed bottom-0 left-0 w-full h-20 z-50 flex justify-around items-center px-4 pb-2 bg-black border-t border-zinc-900 shrink-0">
<a class="flex flex-col items-center justify-center bg-[#00FF41] text-black rounded px-6 py-2" href="#">
<span class="material-symbols-outlined">settings_input_component</span>
<span class="font-bold uppercase text-[9px] tracking-widest mt-1">CONFIG</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-700 px-6 py-2" href="#">
<span class="material-symbols-outlined">mic</span>
<span class="font-bold uppercase text-[9px] tracking-widest mt-1">PTT</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-700 px-6 py-2" href="#">
<span class="material-symbols-outlined">terminal</span>
<span class="font-bold uppercase text-[9px] tracking-widest mt-1">MSGS</span>
</a>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="/session.js"></script>
<script src="/config.js"></script>
</body></html>
