<script>
document.addEventListener("DOMContentLoaded", () => {

    const sessionRaw = localStorage.getItem('av_session');

    if (!sessionRaw) {
        window.location.href = "/";
        return;
    }

    const session = JSON.parse(sessionRaw);

    const idEl = document.getElementById('system-id');
    const pinEl = document.getElementById('access-pin');
    const btn = document.getElementById('uplink-btn');

    if (idEl) idEl.innerText = session.roomID;
    if (pinEl) pinEl.innerText = session.pin;

    if (btn) {
        btn.onclick = () => {
            window.location.href = "grid.html";
        };
    }

});
</script>
