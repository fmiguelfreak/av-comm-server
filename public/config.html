<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM | Show Configuration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;600;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ffb4ab",
              "on-error-container": "#ffdad6",
              "outline-variant": "#3b4b37",
              "inverse-primary": "#006e16",
              "secondary-fixed": "#ffdcc1",
              "on-primary": "#003907",
              "surface-bright": "#393939",
              "primary-container": "#00ff41",
              "on-secondary-fixed": "#2e1500",
              "on-secondary-container": "#613400",
              "surface-container-low": "#1c1b1b",
              "on-primary-container": "#007117",
              "tertiary-fixed": "#ffdad2",
              "tertiary": "#fff8f6",
              "surface-tint": "#00e639",
              "on-error": "#690005",
              "surface-variant": "#353534",
              "on-tertiary-fixed": "#3c0700",
              "on-secondary": "#4c2700",
              "error-container": "#93000a",
              "surface-container-highest": "#353534",
              "primary-fixed": "#72ff70",
              "tertiary-fixed-dim": "#ffb4a2",
              "secondary-fixed-dim": "#ffb778",
              "surface": "#131313",
              "secondary-container": "#fd9000",
              "on-secondary-fixed-variant": "#6c3a00",
              "surface-dim": "#131313",
              "primary-fixed-dim": "#00e639",
              "surface-container-lowest": "#0e0e0e",
              "inverse-surface": "#e5e2e1",
              "on-tertiary-container": "#b82a00",
              "on-surface": "#e5e2e1",
              "on-tertiary": "#621100",
              "tertiary-container": "#ffd3c8",
              "inverse-on-surface": "#313030",
              "outline": "#84967e",
              "primary": "#ebffe2",
              "on-background": "#e5e2e1",
              "surface-container": "#201f1f",
              "on-primary-fixed": "#002203",
              "on-tertiary-fixed-variant": "#8a1d00",
              "secondary": "#ffb778",
              "background": "#131313",
              "on-primary-fixed-variant": "#00530e",
              "surface-container-high": "#2a2a2a",
              "on-surface-variant": "#b9ccb2"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glitch-subtle {
        text-shadow: 2px 0 #007117, -2px 0 #93000a;
      }
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      .scroll-container {
        height: calc(100vh - 80px - 68px); /* Height minus header and footer */
        overflow-y: auto;
        scrollbar-width: none;
      }
      .scroll-container::-webkit-scrollbar {
        display: none;
      }
      .role-btn.active {
        background-color: #00ff41;
        color: #003907;
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
      }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container flex flex-col">
<!-- Top Navigation -->
<header class="bg-[#131313] text-[#00FF41] font-['Space_Grotesk'] uppercase tracking-widest text-sm border-b-2 border-[#00FF41]/30 flex justify-between items-center w-full px-4 py-3 shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl">terminal</span>
<h1 class="font-bold tracking-tighter text-lg">SESSION: CONFIG</h1>
</div>
<span class="px-2 py-0.5 bg-surface-container-high border border-primary-container/30 text-[9px] font-black tracking-widest">SETUP_MODE</span>
</header>
<main class="flex-grow scroll-container px-4 py-4">
<div class="max-w-md mx-auto space-y-4">
<!-- Section 01: Credentials -->
<section class="bg-surface-container-low border-l-2 border-primary-container p-4">
<div class="flex items-center justify-between mb-4">
<h2 class="font-headline font-bold text-[10px] uppercase tracking-widest text-primary-fixed">01: SYSTEM AUTH</h2>
<span class="material-symbols-outlined text-primary-container/40 text-sm">fingerprint</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="font-label text-[9px] font-black uppercase tracking-widest text-on-surface-variant mb-1 block">System ID</label>
<div class="bg-surface-container-lowest p-3 border-l-2 border-primary-container">
<span class="font-headline text-3xl font-light tracking-tighter text-primary-container glitch-subtle" id="system-id">----</span>
</div>
</div>
<div>
<label class="font-label text-[9px] font-black uppercase tracking-widest text-on-surface-variant mb-1 block">Access Pin</label>
<div class="bg-surface-container-lowest p-3 border-l-2 border-secondary-container">
<span class="font-headline text-3xl font-light tracking-tighter text-secondary-container" id="access-pin">----</span>
</div>
</div>
</div>
</section>
<!-- Section 02: Role Assignment -->
<section class="bg-surface-container-low p-4">
<h2 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-primary-container mb-4 text-center">02: OPERATIONAL ROLE</h2>
<div class="grid grid-cols-2 gap-2 mb-4" id="role-grid">
<button class="role-btn bg-surface-container-high p-3 text-left transition-all" onclick="selectRole('FOH')">
<span class="font-label text-[8px] block opacity-50 mb-1">FRONT OF HOUSE</span>
<span class="font-headline text-sm font-bold uppercase">FOH</span>
</button>
<button class="role-btn bg-surface-container-high p-3 text-left transition-all" onclick="selectRole('BOH')">
<span class="font-label text-[8px] block opacity-50 mb-1">BACK OF HOUSE</span>
<span class="font-headline text-sm font-bold uppercase">BOH</span>
</button>
<button class="role-btn bg-surface-container-high p-3 text-left transition-all" onclick="selectRole('MICS')">
<span class="font-label text-[8px] block opacity-50 mb-1">WIRELESS</span>
<span class="font-headline text-sm font-bold uppercase">MICS</span>
</button>
<button class="role-btn bg-surface-container-high p-3 text-left transition-all" onclick="selectRole('CUSTOM')">
<span class="font-label text-[8px] block opacity-50 mb-1">USER DEFINED</span>
<span class="font-headline text-sm font-bold uppercase">CUSTOM</span>
</button>
</div>
<!-- Conditional Custom Input -->
<div class="hidden" id="custom-role-container">
<div class="bg-surface-container-highest flex items-center border-l-2 border-primary-fixed">
<div class="p-3 bg-surface-container-high text-primary-container">
<span class="material-symbols-outlined text-sm">edit_note</span>
</div>
<input class="bg-transparent border-none text-on-surface font-headline font-bold uppercase tracking-widest focus:ring-0 w-full px-4 py-2 text-sm" id="custom-role-input" placeholder="ENTER ROLE..." type="text"/>
</div>
</div>
</section>
<!-- Section 03: Channel Density -->
<section class="bg-surface-container-low p-4">
<h2 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-primary-container mb-4 text-center">03: CHANNEL DENSITY</h2>
<div class="space-y-4">
<div class="flex justify-between items-end">
<div>
<span class="font-headline text-4xl font-black text-on-surface" id="channel-display">12</span>
<span class="font-label text-[10px] uppercase text-on-surface-variant tracking-widest ml-1">Active</span>
</div>
<div class="text-right">
<span class="font-label text-[8px] uppercase text-on-surface-variant block">Allocation</span>
<span class="font-headline text-[10px] font-bold text-primary-container" id="percent-display">50.0% OF MAX</span>
</div>
</div>
<!-- Range Slider -->
<div class="relative py-2">
<input class="w-full h-1.5 bg-surface-container-highest rounded-none appearance-none cursor-pointer accent-primary-container" id="channel-slider" max="24" min="1" oninput="updateChannels(this.value)" type="range" value="12"/>
<div class="flex justify-between font-label text-[8px] font-black text-on-surface-variant/50 mt-2">
<span>01_CH</span>
<span>12_CH</span>
<span>24_MAX</span>
</div>
</div>
</div>
</section>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-sm font-headline font-black text-sm uppercase tracking-[0.3em] shadow-[0_0_20px_rgba(0,255,65,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-3" onclick="initializeUplink()">
<span class="material-symbols-outlined text-lg">cloud_upload</span>
            INITIALIZE UPLINK
        </button>
</div>
</main>
<!-- Bottom Navigation (Fixed) -->
<nav class="shrink-0 w-full flex justify-around items-center px-2 bg-[#0e0e0e] h-[68px] border-t border-white/5 z-50">
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 pointer-events-none" href="#">
<span class="material-symbols-outlined text-xl mb-0.5">hub</span>
<span class="font-['Inter'] text-[8px] uppercase font-black tracking-tighter">Channels</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 pointer-events-none" href="#">
<span class="material-symbols-outlined text-xl mb-0.5">forum</span>
<span class="font-['Inter'] text-[8px] uppercase font-black tracking-tighter">Messages</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 pointer-events-none" href="#">
<span class="material-symbols-outlined text-xl mb-0.5">mic</span>
<span class="font-['Inter'] text-[8px] uppercase font-black tracking-tighter">PTT</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 pointer-events-none" href="#">
<span class="material-symbols-outlined text-xl mb-0.5">notifications_active</span>
<span class="font-['Inter'] text-[8px] uppercase font-black tracking-tighter">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#00FF41] text-[#131313] rounded-sm px-3 py-1.5" href="#">
<span class="material-symbols-outlined text-xl mb-0.5">settings</span>
<span class="font-['Inter'] text-[8px] uppercase font-black tracking-tighter">Settings</span>
</a>
</nav>
<script>
    let selectedRole = 'CUSTOM';
    let currentId = '';
    let currentPin = '';

    function generateCredentials() {
        currentId = Math.floor(1000 + Math.random() * 9000).toString();
        currentPin = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('system-id').innerText = currentId;
        document.getElementById('access-pin').innerText = currentPin;
    }

    function selectRole(role) {
        selectedRole = role;
        
        // Update UI buttons
        const buttons = document.querySelectorAll('.role-btn');
        buttons.forEach(btn => {
            const roleName = btn.querySelector('.font-headline').innerText;
            if (roleName === role || (role === 'CUSTOM' && roleName === 'CUSTOM')) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // Toggle custom input
        const container = document.getElementById('custom-role-container');
        if (role === 'CUSTOM') {
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }

    function updateChannels(val) {
        document.getElementById('channel-display').innerText = val;
        const percent = ((val / 24) * 100).toFixed(1);
        document.getElementById('percent-display').innerText = `${percent}% OF MAX`;
    }

    function initializeUplink() {
        let roleToSave = selectedRole;
        if (selectedRole === 'CUSTOM') {
            roleToSave = document.getElementById('custom-role-input').value || 'CUSTOM_USER';
        }

        const config = {
            id: currentId,
            pin: currentPin,
            role: roleToSave,
            channels: document.getElementById('channel-slider').value
        };

        localStorage.setItem('av_comm_config', JSON.stringify(config));
        
        // Visual feedback
        const btn = event.currentTarget;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> UPLINKING...';
        btn.disabled = true;

        setTimeout(() => {
            window.location.href = 'grid.html';
        }, 800);
    }

    // Init
    window.onload = () => {
        generateCredentials();
        selectRole('CUSTOM');
        updateChannels(12);
        document.getElementById('custom-role-input').value = 'A1 - LEAD';
    };
</script>
</body></html>
