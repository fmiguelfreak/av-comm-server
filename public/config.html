      }

<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 bg-[#131313] top-0 left-0 border-b-4 border-[#00FF41] shadow-[0_0_20px_rgba(0,255,65,0.15)] fixed">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF41]" data-icon="sensors">sensors</span>
<span class="font-headline font-bold tracking-tighter text-[#00FF41] text-lg">STAGE_TECH_AUTH</span>
</div>
<div class="flex items-center gap-6">
<div class="flex gap-4">
<span class="font-headline uppercase tracking-widest text-sm text-[#00FF41]">SYSTEM_ACTIVE</span>
</div>
<button class="material-symbols-outlined text-[#00FF41] hover:bg-[#2a2a2a] transition-colors p-2 rounded active:scale-95 duration-75" data-icon="sync">sync</button>
</div>
</header>
<main class="h-screen pt-20 pb-20 grid-pattern flex flex-col items-center justify-center px-4">
<!-- Confirmation Header (Show ID & PIN) -->
<div class="w-full max-w-4xl mb-8 flex flex-col md:flex-row gap-4 items-stretch">
<div class="flex-1 bg-surface-container border-l-4 border-primary-container p-6 flex justify-between items-center shadow-[0_0_15px_rgba(0,255,65,0.05)]">
<div>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-1">Generated Show ID</p>
<h2 class="font-headline text-4xl font-bold text-primary-container tracking-tighter">XC-9921</h2>
</div>
<span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="qr_code_2">qr_code_2</span>
</div>
<div class="flex-1 bg-surface-container border-l-4 border-primary-container p-6 flex justify-between items-center shadow-[0_0_15px_rgba(0,255,65,0.05)]">
<div>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-outline mb-1">Access PIN</p>
<h2 class="font-headline text-4xl font-bold text-primary-container tracking-widest">4401</h2>
</div>
<span class="material-symbols-outlined text-outline-variant text-4xl" data-icon="lock">lock</span>
</div>
</div>
<!-- Configuration Grid -->
<div class="w-full max-w-4xl bg-surface-container-low p-1 relative">
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-1 bg-surface-container-highest">
<!-- Show Name Input -->
<div class="bg-surface-container p-8 flex flex-col justify-center gap-4">
<label class="font-label text-[10px] uppercase tracking-widest text-primary-fixed">01_CONFIGURATION_NAME</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none border-l-4 border-transparent focus:border-primary-fixed text-primary-container font-headline font-medium text-xl p-4 focus:ring-0 placeholder:text-outline-variant uppercase" placeholder="ENTER SHOW IDENTIFIER..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-outline-variant" data-icon="edit_note">edit_note</span>
</div>
</div>
</div>
<!-- Channel Count Input -->
<div class="bg-surface-container p-8 flex flex-col justify-center gap-4">
<label class="font-label text-[10px] uppercase tracking-widest text-primary-fixed">02_CHANNEL_ALLOCATION</label>
<div class="flex items-center gap-4">
<button class="bg-surface-container-highest text-on-surface hover:bg-primary-container hover:text-on-primary-container w-14 h-14 flex items-center justify-center transition-all active:scale-90">-</button>
<div class="flex-1 bg-surface-container-highest p-4 text-center">
<span class="font-headline text-3xl font-bold text-primary-container">16</span>
<span class="font-label text-xs text-outline block">UNITS</span>
</div>
<button class="bg-surface-container-highest text-on-surface hover:bg-primary-container hover:text-on-primary-container w-14 h-14 flex items-center justify-center transition-all active:scale-90">+</button>
</div>
</div>
<!-- Role Selection -->
<div class="bg-surface-container p-8 col-span-1 md:col-span-2 flex flex-col gap-6">
<label class="font-label text-[10px] uppercase tracking-widest text-primary-fixed">03_OPERATIONAL_ROLE</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<button class="group flex flex-col items-center justify-center p-6 bg-primary-container text-on-primary-container rounded-sm shadow-[0_0_15px_rgba(0,255,65,0.4)] transition-all">
<span class="material-symbols-outlined text-3xl mb-2" data-icon="settings_input_component">settings_input_component</span>
<span class="font-label font-black text-[10px] tracking-tighter">FOH</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-highest text-outline hover:text-primary-container hover:bg-[#2a2a2a] transition-all">
<span class="material-symbols-outlined text-3xl mb-2" data-icon="terminal">terminal</span>
<span class="font-label font-black text-[10px] tracking-tighter">BOH</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-highest text-outline hover:text-primary-container hover:bg-[#2a2a2a] transition-all">
<span class="material-symbols-outlined text-3xl mb-2" data-icon="mic">mic</span>
<span class="font-label font-black text-[10px] tracking-tighter">MICS</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-highest text-outline hover:text-primary-container hover:bg-[#2a2a2a] transition-all">
<span class="material-symbols-outlined text-3xl mb-2" data-icon="dashboard_customize">dashboard_customize</span>
<span class="font-label font-black text-[10px] tracking-tighter">CUSTOM</span>
</button>
</div>
</div>
</div>
</div>
<!-- Start Session Button -->
<div class="w-full max-w-4xl mt-8">
<a class="w-full py-8 bg-primary-container text-on-primary-container font-headline font-black text-2xl tracking-[0.3em] uppercase flex items-center justify-center gap-4 hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_10px_40px_rgba(0,255,65,0.2)]" href="grid.html">
<span class="material-symbols-outlined text-4xl" data-icon="play_arrow" data-weight="fill">play_arrow</span>
                START SESSION
            </a>
<div class="flex justify-between mt-4">
<p class="font-label text-[9px] text-outline-variant tracking-widest uppercase">Encryption: 256-bit AES Tactical</p>
<p class="font-label text-[9px] text-outline-variant tracking-widest uppercase">Node: US-EAST-01</p>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full h-20 z-50 flex justify-around items-center px-4 pb-2 bg-[#0e0e0e] border-t-2 border-[#1c1b1b]">

<a class="flex flex-col items-center justify-center text-[#2a2a2a] hover:text-[#00FF41] px-6 py-2 hover:bg-[#1c1b1b] transition-all active:bg-[#72ff70] active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter mt-1">PTT</span>

<a class="flex flex-col items-center justify-center text-[#2a2a2a] hover:text-[#00FF41] px-6 py-2 hover:bg-[#1c1b1b] transition-all active:bg-[#72ff70] active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter mt-1">MSGS</span>
</a>
</nav>

<div class="fixed top-24 left-6 hidden xl:block">
<div class="flex flex-col gap-1">
<div class="w-1 h-12 bg-primary-container/20"></div>
<div class="w-1 h-4 bg-primary-container"></div>
<div class="w-1 h-1 bg-primary-container"></div>
</div>
</div>
<div class="fixed bottom-24 right-6 hidden xl:block">
<div class="flex flex-col gap-1 items-end">
<div class="w-8 h-px bg-primary-container/40"></div>
<div class="w-12 h-px bg-primary-container/40"></div>
<div class="w-4 h-px bg-primary-container"></div>
<p class="font-label text-[8px] text-primary-container uppercase mt-2 rotate-90 origin-right">v2.4.0-stable</p>
</div>
