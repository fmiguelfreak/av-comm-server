<span class="font-label text-xs text-outline block uppercase tracking-widest mt-1">Units</span>
</div>
<button class="bg-surface-container-highest text-on-surface hover:bg-primary-container hover:text-on-primary-container w-16 h-16 flex items-center justify-center transition-all active:scale-90" id="increment-channels">+</button>
</div>
</div>
<!-- Role Selection (Interactive) - Now 02 -->
<div class="bg-surface-container p-8 flex flex-col gap-6">
<label class="font-label text-[10px] uppercase tracking-widest text-primary-fixed">02_OPERATIONAL_ROLE</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="role-grid">
<button class="role-btn role-active group flex flex-col items-center justify-center p-6 bg-surface-container-highest text-outline hover:text-primary-container hover:bg-[#2a2a2a] transition-all" data-role="FOH">

<div class="w-1 h-4 bg-primary-container"></div>
<div class="w-1 h-1 bg-primary-container"></div>
</div>

<div class="fixed bottom-24 right-6 hidden xl:block">
<div class="flex flex-col gap-1 items-end">

<p class="font-label text-[8px] text-primary-container uppercase mt-2 rotate-90 origin-right">v2.4.0-stable</p>
</div>
</div>
<script>
    // Channel Allocation Counter Logic
    const countDisplay = document.getElementById('channel-count');
    const decrementBtn = document.getElementById('decrement-channels');
    const incrementBtn = document.getElementById('increment-channels');
    let channels = 16;
    let selectedRole = 'FOH';

    const updateDisplay = () => {
        countDisplay.textContent = channels;
    };

    decrementBtn.addEventListener('click', () => {
        if (channels > 1) {
            channels--;
            updateDisplay();
        }
    });

    incrementBtn.addEventListener('click', () => {
        if (channels < 24) {
            channels++;
            updateDisplay();
        }
    });

    // Role Selection Logic
    const roleButtons = document.querySelectorAll('.role-btn');
    roleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            roleButtons.forEach(b => b.classList.remove('role-active'));
            btn.classList.add('role-active');
            selectedRole = btn.getAttribute('data-role');
        });
    });

    // Pulse Effect and Navigation logic for Launch CTA
    const launchCta = document.getElementById('launch-cta');
    
    launchCta.addEventListener('click', () => {
        // Save to localStorage for the grid page to pick up
        localStorage.setItem('stage_tech_channels', channels);
        localStorage.setItem('stage_tech_role', selectedRole);
        
        // Navigate with URL params as fallback
        window.location.href = `grid.html?channels=${channels}&role=${selectedRole}`;
    });

    setInterval(() => {
        launchCta.style.boxShadow = `0 10px 40px rgba(0,255,65,${0.2 + Math.random() * 0.15})`;
    }, 1000);
</script>
