<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ST-04 // OPS-9 CONFIG</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#b9ccb2",
                        "on-primary-fixed-variant": "#00530e",
                        "on-primary": "#003907",
                        "secondary-fixed": "#ffdcc1",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb778",
                        "on-secondary-fixed": "#2e1500",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffdad2",
                        "on-primary-fixed": "#002203",
                        "tertiary": "#fff8f6",
                        "tertiary-fixed-dim": "#ffb4a2",
                        "surface-variant": "#353534",
                        "on-error": "#690005",
                        "outline": "#84967e",
                        "tertiary-container": "#ffd3c8",
                        "on-primary-container": "#007117",
                        "secondary": "#ffb778",
                        "primary-fixed-dim": "#00e639",
                        "on-tertiary-fixed": "#3c0700",
                        "inverse-primary": "#006e16",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#313030",
                        "primary-container": "#00ff41",
                        "on-secondary-fixed-variant": "#6c3a00",
                        "surface-container-lowest": "#0e0e0e",
                        "background": "#131313",
                        "surface-bright": "#393939",
                        "secondary-container": "#fd9000",
                        "primary-fixed": "#72ff70",
                        "surface-dim": "#131313",
                        "on-secondary-container": "#613400",
                        "on-tertiary-container": "#b82a00",
                        "on-tertiary-fixed-variant": "#8a1d00",
                        "outline-variant": "#3b4b37",
                        "surface-container-highest": "#353534",
                        "on-background": "#e5e2e1",
                        "surface-container-low": "#1c1b1b",
                        "primary": "#ebffe2",
                        "on-tertiary": "#621100",
                        "inverse-surface": "#e5e2e1",
                        "surface-tint": "#00e639",
                        "surface-container": "#201f1f",
                        "surface": "#131313",
                        "error": "#ffb4ab",
                        "on-surface": "#e5e2e1",
                        "on-secondary": "#4c2700"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #131313;
            color: #e5e2e1;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Custom radio styling for tactical feel */
        input[type="radio"]:checked + label {
            background-color: #00ff41;
            color: #007117;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TOP APP BAR -->
<header class="bg-[#131313] dark:bg-[#131313] text-[#00FF41] font-['Space_Grotesk'] uppercase tracking-widest text-sm docked full-width top-0 border-b-4 border-[#1c1b1b] shadow-[0_0_20px_rgba(0,255,65,0.15)] flex justify-between items-center px-4 h-16 w-full z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">terminal</span>
<h1 class="text-[#00FF41] font-bold tracking-tighter text-lg">ST-04 // OPS-9</h1>
</div>
<div class="bg-surface-container-low px-3 py-1 rounded-sm border border-outline-variant/20">
<span class="text-[10px] opacity-50 block leading-none">STATUS</span>
<span class="font-bold text-xs">CONFIG_MODE</span>
</div>
</header>
<!-- MAIN CONTENT CANVAS -->
<main class="flex flex-col h-[calc(100vh-64px)] w-full p-4 gap-4 overflow-hidden bg-background">
<!-- SYSTEM IDENTIFIERS SECTION -->
<section class="grid grid-cols-2 gap-3">
<div class="bg-surface-container-low p-4 relative group overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary-container"></div>
<label class="font-headline text-[10px] uppercase tracking-widest text-on-surface-variant block mb-1">SYSTEM_ID</label>
<div class="text-3xl font-headline font-bold text-primary tracking-tighter" id="display-id">----</div>
</div>
<div class="bg-surface-container-low p-4 relative group overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-secondary-container"></div>
<label class="font-headline text-[10px] uppercase tracking-widest text-on-surface-variant block mb-1">SECURE_PIN</label>
<div class="text-3xl font-headline font-bold text-secondary tracking-tighter" id="display-pin">----</div>
</div>
</section>
<!-- CONFIGURATION GRID -->
<div class="flex-1 grid grid-cols-1 gap-4 overflow-hidden">
<!-- ROLE SELECTOR -->
<section class="bg-surface-container p-4 flex flex-col gap-3">
<div class="flex items-center justify-between border-b border-outline-variant/10 pb-2">
<label class="font-headline text-xs uppercase tracking-[0.2em] text-on-surface">OPERATIONAL_ROLE</label>
<span class="material-symbols-outlined text-sm opacity-30">security</span>
</div>
<div class="grid grid-cols-4 gap-2">
<div class="relative">
<input checked="" class="hidden peer" id="role-foh" name="role" type="radio" value="FOH"/>
<label class="flex flex-col items-center justify-center py-4 bg-surface-container-high text-on-surface font-headline font-bold text-xs transition-all cursor-pointer rounded-sm hover:bg-[#2a2a2a]" for="role-foh">
                            FOH
                        </label>
</div>
<div class="relative">
<input class="hidden peer" id="role-boh" name="role" type="radio" value="BOH"/>
<label class="flex flex-col items-center justify-center py-4 bg-surface-container-high text-on-surface font-headline font-bold text-xs transition-all cursor-pointer rounded-sm hover:bg-[#2a2a2a]" for="role-boh">
                            BOH
                        </label>
</div>
<div class="relative">
<input class="hidden peer" id="role-mics" name="role" type="radio" value="MICS"/>
<label class="flex flex-col items-center justify-center py-4 bg-surface-container-high text-on-surface font-headline font-bold text-xs transition-all cursor-pointer rounded-sm hover:bg-[#2a2a2a]" for="role-mics">
                            MICS
                        </label>
</div>
<div class="relative">
<input class="hidden peer" id="role-custom" name="role" type="radio" value="CUSTOM"/>
<label class="flex flex-col items-center justify-center py-4 bg-surface-container-high text-on-surface font-headline font-bold text-xs transition-all cursor-pointer rounded-sm hover:bg-[#2a2a2a]" for="role-custom">
                            SPEC
                        </label>
</div>
</div>
<!-- HIDDEN CUSTOM ROLE INPUT -->
<div class="hidden animate-in fade-in slide-in-from-top-2 duration-300" id="custom-role-container">
<input class="w-full bg-surface-container-highest border-l-4 border-primary-fixed text-on-surface p-3 font-headline text-sm uppercase tracking-wider focus:ring-0 focus:outline-none placeholder:opacity-30" id="custom-role-input" placeholder="ENTER CUSTOM DESIGNATION..." type="text"/>
</div>
</section>
<!-- CHANNEL SELECTOR -->
<section class="bg-surface-container p-4 flex flex-col gap-3">
<div class="flex items-center justify-between border-b border-outline-variant/10 pb-2">
<label class="font-headline text-xs uppercase tracking-[0.2em] text-on-surface">SIGNAL_CHANNELS</label>
<span class="material-symbols-outlined text-sm opacity-30">settings_input_component</span>
</div>
<div class="flex items-center gap-4 bg-surface-container-lowest p-4 rounded-sm border border-outline-variant/10">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-high text-primary-container rounded-sm active:scale-95 transition-transform" id="chan-minus">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex-1 text-center">
<div class="text-4xl font-headline font-black text-on-surface" id="chan-count">12</div>
<div class="text-[9px] uppercase tracking-widest opacity-40 font-bold">ACTIVE_NODES</div>
</div>
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-high text-primary-container rounded-sm active:scale-95 transition-transform" id="chan-plus">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>
</div>
<!-- CTA BUTTON -->
<footer class="mt-auto">
<button class="w-full bg-primary-container text-on-primary-container py-5 rounded-sm font-headline font-black uppercase tracking-[0.25em] text-lg shadow-[0_0_20px_rgba(0,255,65,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-3" id="init-uplink">
<span class="material-symbols-outlined">router</span>
                INITIALIZE UPLINK
            </button>
</footer>
</main>
<script>
        // DOM Elements
        const displayId = document.getElementById('display-id');
        const displayPin = document.getElementById('display-pin');
        const chanCount = document.getElementById('chan-count');
        const chanMinus = document.getElementById('chan-minus');
        const chanPlus = document.getElementById('chan-plus');
        const roleRadios = document.getElementsByName('role');
        const customRoleContainer = document.getElementById('custom-role-container');
        const customRoleInput = document.getElementById('custom-role-input');
        const initButton = document.getElementById('init-uplink');

        // State initialization from localStorage or defaults
        let config = JSON.parse(localStorage.getItem('st04_ops9_config')) || {};
        
        // Use default ID/PIN if not found, and ensure they are 4-digit numeric only
        let currentId = String(config.id || Math.floor(1000 + Math.random() * 9000)).padStart(4, '0').slice(0, 4);
        let currentPin = String(config.pin || Math.floor(1000 + Math.random() * 9000)).padStart(4, '0').slice(0, 4);
        let currentChannels = parseInt(config.channels) || 12;

        // Init values on screen
        displayId.textContent = currentId;
        displayPin.textContent = currentPin;
        chanCount.textContent = currentChannels;

        // Channel Controls
        chanMinus.addEventListener('click', () => {
            if (currentChannels > 1) {
                currentChannels--;
                chanCount.textContent = currentChannels;
            }
        });

        chanPlus.addEventListener('click', () => {
            if (currentChannels < 24) {
                currentChannels++;
                chanCount.textContent = currentChannels;
            }
        });

        // Role Logic
        roleRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'CUSTOM') {
                    customRoleContainer.classList.remove('hidden');
                    customRoleInput.focus();
                } else {
                    customRoleContainer.classList.add('hidden');
                }
            });
        });

        // Initialize Logic
        initButton.addEventListener('click', () => {
            let selectedRadio = document.querySelector('input[name="role"]:checked');
            let selectedRole = selectedRadio.value;
            let finalRoleName = selectedRole;
            
            if (selectedRole === 'CUSTOM') {
                finalRoleName = customRoleInput.value.trim().toUpperCase() || 'CUSTOM_SPEC';
            }

            const configData = {
                id: currentId,
                pin: currentPin,
                role: finalRoleName,
                channels: currentChannels,
                timestamp: new Date().toISOString()
            };

            // Save all final data to localStorage
            localStorage.setItem('st04_ops9_config', JSON.stringify(configData));

            // Visual feedback
            initButton.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> UPLINKING...`;
            initButton.classList.replace('bg-primary-container', 'bg-surface-container-highest');
            initButton.classList.add('text-primary-container');

            // Redirect to grid.html
            setTimeout(() => {
                window.location.href = 'grid.html';
            }, 800);
        });
    </script>
</body></html>
