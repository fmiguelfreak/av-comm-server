<script>
let socket;
let selectedRole = 'FOH';

function connectSocket() {
    const statusEl = document.getElementById('connection-status');
    const uplinkBtn = document.getElementById('uplink-btn');

    socket = io("https://av-comm-server-production.up.railway.app");

    socket.on('connect', () => {
        statusEl.innerText = 'ONLINE';
        uplinkBtn.disabled = false;
    });

    socket.on('disconnect', () => {
        statusEl.innerText = 'OFFLINE';
        uplinkBtn.disabled = true;
    });

    socket.on('room_created', (data) => {
        const config = {
            id: data.roomID,
            pin: data.pin,
            role: selectedRole,
            channels: data.channels
        };

        localStorage.setItem('av_comm_config', JSON.stringify(config));

        document.getElementById('system-id').innerText = data.roomID;
        document.getElementById('access-pin').innerText = data.pin;

        setTimeout(() => {
            window.location.href = 'grid.html';
        }, 800);
    });
}

function selectRole(role) {
    selectedRole = role;
}

function initializeUplink() {
    socket.emit('create_room', {
        channels: document.getElementById('channel-slider').value
    });
}

window.onload = () => {
    connectSocket();
};
</script>
