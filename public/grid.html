<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GRID</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body style="background:#111;color:white;font-family:sans-serif;text-align:center">

<h2 id="title"></h2>

<div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px"></div>

<script>
const socket = io();

const session = JSON.parse(localStorage.getItem('av_session'));

document.getElementById('title').innerText = `ROOM ${session.roomID}`;

let channels = session.channels || 12;

// JOIN ROOM AUTOMATICAMENTE
socket.emit('join_room', {
    roomID: session.roomID,
    pin: session.pin,
    role: "CLIENT"
});

// CRIAR GRID
for (let i = 1; i <= channels; i++) {
    const btn = document.createElement('button');
    btn.innerText = "CH " + i;
    btn.style.height = "80px";

    btn.onclick = () => {
        socket.emit('update_channel', {
            roomID: session.roomID,
            chID: i,
            status: "active",
            role: "CLIENT"
        });
    };

    btn.id = "ch_" + i;
    document.getElementById('grid').appendChild(btn);
}

// RECEBER UPDATES
socket.on('channel_updated', (data) => {
    const el = document.getElementById("ch_" + data.chID);

    if (data.status === "active") {
        el.style.background = "green";
    } else {
        el.style.background = "gray";
    }
});
</script>

</body>
</html>
