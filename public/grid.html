<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SESSION: OPERATIONAL GRID</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "inverse-primary": "#006e16",
                "tertiary-fixed": "#ffdad2",
                "surface-container": "#201f1f",
                "surface": "#131313",
                "primary": "#ebffe2",
                "on-tertiary-fixed-variant": "#8a1d00",
                "surface-dim": "#131313",
                "error-container": "#93000a",
                "on-primary-fixed": "#002203",
                "secondary": "#ffb778",
                "inverse-surface": "#e5e2e1",
                "on-tertiary-container": "#b82a00",
                "tertiary": "#fff8f6",
                "surface-tint": "#00e639",
                "surface-container-high": "#2a2a2a",
                "outline": "#84967e",
                "on-secondary-fixed-variant": "#6c3a00",
                "primary-container": "#00ff41",
                "on-tertiary-fixed": "#3c0700",
                "on-background": "#e5e2e1",
                "surface-variant": "#353534",
                "primary-fixed": "#72ff70",
                "surface-container-lowest": "#0e0e0e",
                "secondary-fixed-dim": "#ffb778",
                "primary-fixed-dim": "#00e639",
                "error": "#ffb4ab",
                "tertiary-fixed-dim": "#ffb4a2",
                "surface-bright": "#393939",
                "surface-container-low": "#1c1b1b",
                "on-secondary": "#4c2700",
                "on-primary-container": "#007117",
                "background": "#131313",
                "secondary-fixed": "#ffdcc1",
                "on-error-container": "#ffdad6",
                "on-primary-fixed-variant": "#00530e",
                "outline-variant": "#3b4b37",
                "secondary-container": "#fd9000",
                "on-tertiary": "#621100",
                "inverse-on-surface": "#313030",
                "surface-container-highest": "#353534",
                "tertiary-container": "#ffd3c8",
                "on-surface": "#e5e2e1",
                "on-surface-variant": "#b9ccb2",
                "on-primary": "#003907",
                "on-secondary-fixed": "#2e1500",
                "on-secondary-container": "#613400",
                "on-error": "#690005"
              },
              fontFamily: {
                "headline": ["Space Grotesk"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
    </script>
<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sync-pulse {
            box-shadow: 0 0 8px #00ff41;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">
<!-- TopAppBar -->
<header class="bg-[#131313] text-[#00FF41] font-['Space_Grotesk'] uppercase tracking-wider text-sm docked full-width top-0 border-t-4 border-[#00FF41] shadow-[0_0_20px_rgba(0,255,65,0.15)] flex justify-between items-center px-4 h-14 w-full z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-lg">security</span>
<h1 class="font-bold text-[#00FF41] tracking-tighter" id="header-session-id">SESSION: CONNECTING...</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-surface-variant" id="sync-indicator"></div>
<span class="text-[10px] opacity-70" id="sync-status">OFFLINE</span>
</div>
<button class="bg-[#1c1b1b] px-2 py-1 rounded-sm border border-[#3b4b37]/30 active:bg-primary-container/20 transition-colors" id="role-selector">
<span class="text-[#00FF41] font-bold" id="header-role">ROLE: ---</span>
</button>
</div>
</header>
<!-- Tactical Info Bar -->
<div class="bg-surface-container-low px-4 py-2 flex justify-between items-center border-b border-outline-variant/10">
<div class="flex flex-col">
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-[0.1em]">Unit Identifier</span>
<span class="font-headline font-bold text-primary-container" id="unit-identifier">---</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-[0.1em]">Access Pin</span>
<span class="font-headline font-medium text-on-surface" id="access-pin">**** ----</span>
</div>
</div>
<!-- Main Operational Grid -->
<main class="flex-grow p-2 grid grid-cols-2 gap-2 bg-surface overflow-hidden" id="operational-grid">
<!-- Dynamic Content -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-4 h-20 bg-[#131313] border-t border-outline-variant/5">
<div class="flex items-center justify-center text-on-surface-variant p-2 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">grid_view</span>
</div>
<div class="flex items-center justify-center text-on-surface-variant p-2 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">analytics</span>
</div>
<!-- CENTRAL PTT BUTTON (MIC) -->
<div class="flex items-center justify-center bg-[#00FF41] text-[#003907] rounded-sm p-4 scale-125 shadow-[0_0_15px_rgba(0,255,65,0.4)] active:bg-[#72ff70] active:scale-110 transition-all cursor-pointer" id="ptt-button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<div class="flex items-center justify-center text-on-surface-variant p-2 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">settings_remote</span>
</div>
<div class="flex items-center justify-center text-on-surface-variant p-2 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">terminal</span>
</div>
</nav>
<!-- Visual Polish: Surface Glow -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-64 h-32 bg-primary-container/5 blur-[80px] rounded-full -z-10"></div>
<script>
        const socket = io('https://av-comm-server-production.up.railway.app');
        const gridElement = document.getElementById('operational-grid');
        let channels = [];

        // 1. Initialize from localStorage
        function getAppConfig() {
            const configStr = localStorage.getItem('av_comm_config');
            if (configStr) {
                try {
                    return JSON.parse(configStr);
                } catch (e) {
                    console.error("Config parse error", e);
                }
            }
            // Fallback for demo if no config exists
            return {
                roomID: '992-ALPHA',
                pin: '9422',
                role: 'LEAD_TECH',
                unitID: 'FOH_LEAD_01'
            };
        }

        const appConfig = getAppConfig();

        // 2. Socket Connection Logic
        socket.on('connect', () => {
            console.log('Connected to Command Server');
            document.getElementById('sync-indicator').classList.replace('bg-surface-variant', 'bg-primary-container');
            document.getElementById('sync-indicator').classList.add('sync-pulse');
            document.getElementById('sync-status').innerText = 'SYNCED';

            socket.emit('join_room', {
                roomID: appConfig.roomID,
                pin: appConfig.pin,
                role: appConfig.role
            });
        });

        socket.on('disconnect', () => {
            document.getElementById('sync-indicator').classList.remove('sync-pulse', 'bg-primary-container');
            document.getElementById('sync-indicator').classList.add('bg-error');
            document.getElementById('sync-status').innerText = 'OFFLINE';
        });

        socket.on('joined_success', (data) => {
            console.log('Successfully joined session', data);
            document.getElementById('header-session-id').innerText = `SESSION: ${data.roomID}`;
            document.getElementById('header-role').innerText = `ROLE: ${data.role}`;
            document.getElementById('unit-identifier').innerText = appConfig.unitID || 'UNIT_UNKWN';
            document.getElementById('access-pin').innerText = `**** ${appConfig.pin}`;
            
            if (data.channels) {
                renderGrid(data.channels);
            }
        });

        socket.on('update_channel', (updatedChannel) => {
            const index = channels.findIndex(c => c.id === updatedChannel.id);
            if (index !== -1) {
                channels[index] = updatedChannel;
                updateChannelUI(updatedChannel);
            }
        });

        // 3. Grid Rendering
        function renderGrid(channelList) {
            channels = channelList;
            gridElement.innerHTML = '';
            
            // Adjust grid rows based on channel count to maintain 2 columns no scroll
            const rowCount = Math.ceil(channelList.length / 2);
            gridElement.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, 1fr))`;

            channelList.forEach(channel => {
                const card = createChannelCard(channel);
                gridElement.appendChild(card);
            });
        }

        function createChannelCard(channel) {
            const div = document.createElement('div');
            div.id = `channel-${channel.id}`;
            div.className = getCardClasses(channel.status);
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-headline font-bold text-xl ${getTextColorClass(channel.status)}">${channel.name || 'CH ' + channel.id}</span>
                    <span class="material-symbols-outlined ${getIconColorClass(channel.status)}">${getIcon(channel.status)}</span>
                </div>
                <div class="${getBadgeClasses(channel.status)} self-start">
                    <span class="font-label font-bold text-[10px] uppercase tracking-widest">${channel.status || 'READY'}</span>
                </div>
            `;
            
            div.onclick = () => {
                // Tactical interaction
                div.classList.add('scale-95');
                setTimeout(() => div.classList.remove('scale-95'), 100);
            };
            
            return div;
        }

        function updateChannelUI(channel) {
            const card = document.getElementById(`channel-${channel.id}`);
            if (card) {
                card.className = getCardClasses(channel.status);
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-headline font-bold text-xl ${getTextColorClass(channel.status)}">${channel.name || 'CH ' + channel.id}</span>
                        <span class="material-symbols-outlined ${getIconColorClass(channel.status)}">${getIcon(channel.status)}</span>
                    </div>
                    <div class="${getBadgeClasses(channel.status)} self-start">
                        <span class="font-label font-bold text-[10px] uppercase tracking-widest">${channel.status || 'READY'}</span>
                    </div>
                `;
            }
        }

        // Helper Styles
        function getCardClasses(status) {
            const base = "bg-surface-container-high rounded-sm border-l-4 flex flex-col justify-between p-3 relative overflow-hidden transition-all duration-200 active:scale-95 ";
            switch(status) {
                case 'ALERT': return base + "border-error-container";
                case 'PENDING': return base + "border-secondary-container";
                case 'ACTIVE': return base + "border-primary-container shadow-[inset_0_0_15px_rgba(0,255,65,0.05)]";
                default: return base + "border-primary-container/40";
            }
        }

        function getTextColorClass(status) {
            switch(status) {
                case 'ALERT': return "text-error";
                case 'PENDING': return "text-secondary";
                default: return "text-primary-container";
            }
        }

        function getIconColorClass(status) {
            switch(status) {
                case 'ALERT': return "text-error/30";
                case 'PENDING': return "text-secondary/30";
                default: return "text-primary-container/30";
            }
        }

        function getBadgeClasses(status) {
            switch(status) {
                case 'ALERT': return "bg-error-container px-2 py-1 rounded-sm text-on-error-container";
                case 'PENDING': return "bg-secondary-container px-2 py-1 rounded-sm text-on-secondary-container";
                default: return "bg-primary-container/10 px-2 py-1 rounded-sm text-primary-container";
            }
        }

        function getIcon(status) {
            switch(status) {
                case 'ALERT': return "warning";
                case 'PENDING': return "sensors";
                default: return "radar";
            }
        }

        // Interactive Role
        document.getElementById('role-selector').onclick = () => {
            const roles = ['LEAD_TECH', 'STAGE_HAND', 'PRODUCER', 'OBSERVER'];
            const currentIdx = roles.indexOf(appConfig.role);
            const nextIdx = (currentIdx + 1) % roles.length;
            appConfig.role = roles[nextIdx];
            document.getElementById('header-role').innerText = `ROLE: ${appConfig.role}`;
            
            // Re-join with new role
            socket.emit('join_room', {
                roomID: appConfig.roomID,
                pin: appConfig.pin,
                role: appConfig.role
            });
        };

        // PTT Logic
        const pttBtn = document.getElementById('ptt-button');
        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pttBtn.classList.replace('bg-[#00FF41]', 'bg-[#72ff70]');
            pttBtn.classList.add('scale-150');
            // Logic for PTT Start
        });
        pttBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            pttBtn.classList.replace('bg-[#72ff70]', 'bg-[#00FF41]');
            pttBtn.classList.remove('scale-150');
            // Logic for PTT End
        });

    </script>
</body></html>
