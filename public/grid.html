<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ST-04 // OPS-9 TERMINAL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#b9ccb2",
                        "on-primary-fixed-variant": "#00530e",
                        "on-primary": "#003907",
                        "secondary-fixed": "#ffdcc1",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb778",
                        "on-secondary-fixed": "#2e1500",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffdad2",
                        "on-primary-fixed": "#002203",
                        "tertiary": "#fff8f6",
                        "tertiary-fixed-dim": "#ffb4a2",
                        "surface-variant": "#353534",
                        "on-error": "#690005",
                        "outline": "#84967e",
                        "tertiary-container": "#ffd3c8",
                        "on-primary-container": "#007117",
                        "secondary": "#ffb778",
                        "primary-fixed-dim": "#00e639",
                        "on-tertiary-fixed": "#3c0700",
                        "inverse-primary": "#006e16",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#313030",
                        "primary-container": "#00ff41",
                        "on-secondary-fixed-variant": "#6c3a00",
                        "surface-container-lowest": "#0e0e0e",
                        "background": "#131313",
                        "surface-bright": "#393939",
                        "secondary-container": "#fd9000",
                        "primary-fixed": "#72ff70",
                        "surface-dim": "#131313",
                        "on-secondary-container": "#613400",
                        "on-tertiary-container": "#b82a00",
                        "on-tertiary-fixed-variant": "#8a1d00",
                        "outline-variant": "#3b4b37",
                        "surface-container-highest": "#353534",
                        "on-background": "#e5e2e1",
                        "surface-container-low": "#1c1b1b",
                        "primary": "#ebffe2",
                        "on-tertiary": "#621100",
                        "inverse-surface": "#e5e2e1",
                        "surface-tint": "#00e639",
                        "surface-container": "#201f1f",
                        "surface": "#131313",
                        "error": "#ffb4ab",
                        "on-surface": "#e5e2e1",
                        "on-secondary": "#4c2700"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 10px #00ff41; }
            50% { opacity: 0.4; transform: scale(0.9); box-shadow: 0 0 2px #00ff41; }
        }
        .animate-sync-dot {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        body {
            overscroll-behavior-y: contain;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Tactical grid ensures 2 columns and exactly enough rows for content without scrolling */
        .tactical-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 4px;
            background-color: #0e0e0e;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body">
<!-- TopAppBar -->
<header class="bg-[#131313] text-[#00FF41] font-headline uppercase tracking-widest text-sm border-b-2 border-surface-container-highest flex justify-between items-center px-4 h-16 shrink-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-2xl">terminal</span>
<div class="flex flex-col leading-none">
<span class="text-[#00FF41] font-bold tracking-tighter text-lg">ST-04 // OPS-9</span>
<span class="text-[10px] opacity-60 font-body normal-case tracking-normal">
<span id="display-id">8821</span> // <span id="display-pin">1234</span>
</span>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex flex-col items-end leading-none">
<span class="text-xs font-bold text-on-surface tracking-normal text-right max-w-[100px] truncate uppercase" id="display-role">A1 - LEAD AUDIO</span>
</div>
<div class="flex items-center gap-2 px-2 py-1 bg-surface-container-low rounded-sm">
<div class="w-2 h-2 rounded-full bg-primary-container animate-sync-dot"></div>
<span class="text-[10px] font-bold">SYNC</span>
</div>
<button class="bg-primary-container text-on-primary-container hover:bg-opacity-80 transition-all px-3 py-1 text-[10px] font-bold rounded-sm">
                LEAD
            </button>
</div>
</header>
<!-- Main Content: Tactical Grid -->
<main class="tactical-grid" id="channel-grid">
<!-- Grid populated by JS -->
</main>
<!-- BottomNavBar with Central PTT -->
<nav class="bg-[#0e0e0e] w-full h-20 shrink-0 border-t border-surface-container-highest flex justify-around items-center px-2 pb-2 relative z-50">
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-sm p-3 scale-110 shadow-[0_0_15px_rgba(0,255,65,0.3)]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">dns</span>
</div>
<div class="flex flex-col items-center justify-center text-outline p-3 hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-2xl">settings_input_component</span>
</div>
<!-- CENTRAL PTT BUTTON -->
<div class="flex flex-col items-center justify-center -translate-y-5">
<button class="bg-primary-container text-on-primary-container w-20 h-20 rounded-full flex flex-col items-center justify-center shadow-[0_0_25px_rgba(0,255,65,0.5)] border-4 border-background active:scale-95 transition-all outline-none" id="ptt-button">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="text-[10px] font-black font-headline tracking-tighter uppercase">PTT</span>
</button>
</div>
<div class="flex flex-col items-center justify-center text-outline p-3 hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-2xl">analytics</span>
</div>
<div class="flex flex-col items-center justify-center text-outline p-3 hover:text-primary-container transition-colors">
<span class="material-symbols-outlined text-2xl">settings</span>
</div>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Read configuration from localStorage
            const config = {
                id: localStorage.getItem('opID') || '8821',
                pin: localStorage.getItem('opPIN') || '1234',
                role: localStorage.getItem('opRole') || 'A1 - LEAD AUDIO',
                channels: parseInt(localStorage.getItem('channelCount')) || 12
            };

            // Update Header display with stored session data
            document.getElementById('display-id').textContent = config.id;
            document.getElementById('display-pin').textContent = config.pin;
            document.getElementById('display-role').textContent = config.role;

            const grid = document.getElementById('channel-grid');
            
            // Channel definitions
            const channelDefinitions = [
                { name: "Stage Right", type: "VOX", icon: "signal_cellular_4_bar", color: "border-primary-container" },
                { name: "FOH Command", type: "LIVE", icon: "radio_button_checked", color: "border-secondary-container" },
                { name: "Monitors", type: "MUTE", icon: "mic_off", color: "border-outline-variant" },
                { name: "Backline", type: "IDLE", icon: "sensors", color: "border-primary-container" },
                { name: "Lighting Desk", type: "VOX", icon: "keyboard_command_key", color: "border-primary-container" },
                { name: "Rigging", type: "VOX", icon: "construction", color: "border-primary-container" },
                { name: "Video / GFX", type: "VOX", icon: "videocam", color: "border-primary-container" },
                { name: "Prod Lead", type: "HOT", icon: "priority_high", color: "border-error-container", special: "hot" },
                { name: "Security 1", type: "VOX", icon: "shield", color: "border-primary-container" },
                { name: "Utility 01", type: "VOX", icon: "hub", color: "border-primary-container" },
                { name: "System Eng", type: "VOX", icon: "settings_input_hdmi", color: "border-primary-container" },
                { name: "Stage Left", type: "VOX", icon: "signal_cellular_alt", color: "border-primary-container" },
                { name: "Power Distro", type: "IDLE", icon: "bolt", color: "border-primary-container" },
                { name: "Comm Check", type: "VOX", icon: "headset_mic", color: "border-primary-container" }
            ];

            // Calculate rows needed for exactly 2 columns to fit without scroll
            const rowCount = Math.ceil(config.channels / 2);
            grid.style.gridTemplateRows = `repeat(${rowCount}, 1fr)`;

            // Build dynamic grid for the exact number of channels chosen
            for (let i = 0; i < config.channels; i++) {
                // Wrap around definitions if channels exceeds current definition list length
                const def = channelDefinitions[i % channelDefinitions.length];
                const channelNum = (i + 1).toString().padStart(2, '0');
                
                const card = document.createElement('div');
                card.className = `bg-surface-container-low relative flex flex-col justify-between p-3 overflow-hidden border-l-4 ${def.color}`;
                
                const isHot = def.special === 'hot';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold ${isHot ? 'text-error' : 'text-outline'} uppercase">CH.${channelNum}</span>
                            <span class="text-sm font-bold font-headline uppercase leading-tight ${isHot ? 'text-error' : ''}">${def.name}</span>
                        </div>
                        <span class="material-symbols-outlined text-sm ${isHot ? 'text-error' : 'opacity-40'}">${def.icon}</span>
                    </div>
                    <div class="flex items-end justify-between mt-auto">
                        <div class="h-1 w-full bg-surface-container-highest relative overflow-hidden">
                            <div class="absolute inset-0 ${isHot ? 'bg-error animate-pulse' : 'bg-primary-container'} ${def.type === 'LIVE' ? 'w-[20%]' : def.type === 'VOX' ? 'w-[65%] opacity-40' : def.type === 'IDLE' ? 'w-[12%]' : 'w-0'}"></div>
                        </div>
                        <span class="text-[10px] font-bold ml-2 ${isHot ? 'text-error' : 'opacity-60'}">${def.type}</span>
                    </div>
                `;
                grid.appendChild(card);
            }

            // Simple PTT Interaction
            const ptt = document.getElementById('ptt-button');
            const activatePTT = (e) => {
                if(e.cancelable) e.preventDefault();
                ptt.classList.add('bg-secondary-container');
                ptt.classList.remove('bg-primary-container');
            };
            const deactivatePTT = () => {
                ptt.classList.remove('bg-secondary-container');
                ptt.classList.add('bg-primary-container');
            };

            ptt.addEventListener('mousedown', activatePTT);
            ptt.addEventListener('mouseup', deactivatePTT);
            ptt.addEventListener('mouseleave', deactivatePTT);
            ptt.addEventListener('touchstart', activatePTT);
            ptt.addEventListener('touchend', deactivatePTT);
        });
    </script>
</body></html>
