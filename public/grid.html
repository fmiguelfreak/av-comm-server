<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM Tactical Grid</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#00e639",
              "primary-container": "#00ff41",
              "outline": "#84967e",
              "background": "#131313",
              "surface-container-high": "#2a2a2a",
              "on-surface": "#e5e2e1",
              "secondary-container": "#fd9000",
              "error": "#ffb4ab",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        overscroll-behavior: none;
        background-color: #131313;
        height: 100vh;
        overflow: hidden;
      }
      .tactical-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(6, 1fr);
        height: calc(100vh - 4rem - 5rem);
        gap: 0.5rem;
        padding: 0.5rem;
      }
      .channel-card {
        transition: all 0.2s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .channel-card:active {
        transform: scale(0.98);
        filter: brightness(1.2);
      }
    </style>
</head>
<body class="font-body text-on-surface bg-background select-none">
<!-- TOP APP BAR -->
<header class="w-full border-t-4 border-[#00FF41] bg-[#131313] shadow-[0_0_20px_rgba(0,255,65,0.15)] flex justify-between items-center px-4 h-16 sticky top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00FF41] text-xl">terminal</span>
<span class="font-headline font-bold text-lg tracking-tighter text-[#00FF41]">ST-AUTHORITY</span>
</div>
<div class="flex flex-col items-end font-headline uppercase tracking-widest text-xs text-[#00FF41]">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-zinc-600" id="status-dot"></div>
<span id="session-info">OFFLINE</span>
</div>
<span class="text-[9px] opacity-60" id="device-id">ID: ---</span>
</div>
</header>
<!-- MAIN TACTICAL CANVAS (Zero Scroll) -->
<main class="tactical-grid bg-[#1c1b1b]" id="grid-container">
<!-- Template for 12 channels -->

</main>
<!-- BOTTOM NAV BAR / PTT CONSOLE -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-4 bg-[#131313] border-t border-[#3b4b37]/20 h-20">
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">settings_input_component</span>
<span class="font-bold text-[9px] tracking-widest uppercase">SYSTEM</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">settings_ethernet</span>
<span class="font-bold text-[9px] tracking-widest uppercase">PATCH</span>
</div>
<!-- CENTRAL PTT BUTTON -->
<div class="flex flex-col items-center justify-center bg-[#00FF41] text-[#007117] rounded-sm px-7 py-2 scale-110 shadow-[0_0_20px_rgba(0,255,65,0.4)] active:scale-100 transition-all cursor-pointer" id="ptt-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-bold text-[10px] tracking-widest uppercase font-label">PTT</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">hub</span>
<span class="font-bold text-[9px] tracking-widest uppercase">COMMS</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-bold text-[9px] tracking-widest uppercase">LOGS</span>
</div>
</nav>
<!-- PTT OVERLAY -->
<div class="fixed inset-0 bg-black/80 z-[100] hidden flex flex-col items-center justify-center p-8 text-center" id="ptt-overlay">
<div class="w-24 h-24 rounded-full border-4 border-[#00FF41] flex items-center justify-center mb-6 animate-pulse">
<span class="material-symbols-outlined text-4xl text-[#00FF41]">mic</span>
</div>
<h2 class="font-headline text-[#00FF41] text-2xl font-bold mb-2 uppercase tracking-tighter">Broadcasting...</h2>
<p class="text-zinc-400 font-label text-sm">Release to send audio package</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/session.js"></script>
<script src="/grid.js"></script>
</body></html>
