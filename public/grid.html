<!-- SYSTEM OVERLAY GRADIENT (DECORATIVE) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]" style="background-image: radial-gradient(#00FF41 1px, transparent 1px); background-size: 20px 20px;"></div>
<script>
    const ROLES = ['FOH', 'BOH', 'MICS', 'TECH', 'LD'];
    let socket;
    
    function initApp() {
        const config = {
            role: localStorage.getItem('av_comm_role') || 'FOH',
            sessionId: '0492-X' // Hardcoded target for initial join, would normally be dynamic
        };

        // Initialize Header Role
        document.getElementById('header-role').textContent = config.role;

        // Socket Connection
        // Note: Using a generic placeholder URL as real server is determined at runtime
        socket = io('https://api.av-comm.com', { autoConnect: false });
        
        // Manual connect trigger
        socket.connect();

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('join_show', { session: config.sessionId, role: config.role });
        });

        socket.on('show_joined', (data) => {
            // Populate ID and PIN from server response
            document.getElementById('header-id').textContent = data.id || '8821';
            document.getElementById('header-pin').textContent = data.pin || '4401';
            document.getElementById('session-display').textContent = `SESSION: ${data.session || config.sessionId}`;
        });

        // Role Toggle Logic
        document.getElementById('role-toggle').addEventListener('click', () => {
            let currentRole = document.getElementById('header-role').textContent;
            let nextIndex = (ROLES.indexOf(currentRole) + 1) % ROLES.length;
            let nextRole = ROLES[nextIndex];
            
            document.getElementById('header-role').textContent = nextRole;
            localStorage.setItem('av_comm_role', nextRole);
            
            // Re-sync with server
            if (socket && socket.connected) {
                socket.emit('join_show', { session: config.sessionId, role: nextRole });
            }
            
            // Visual feedback
            const btn = document.getElementById('role-toggle');
            btn.classList.add('border-primary-container');
            setTimeout(() => btn.classList.remove('border-primary-container'), 300);
        });

        // PTT Logic (Voice to Text Placeholder)
        const pttBtn = document.getElementById('ptt-button');
        const pttIcon = document.getElementById('ptt-icon');
        
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length-1][0].transcript;
                console.log('Voice Command:', transcript);
                // Here we would emit 'voice_command' to socket
            };
        }

        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pttBtn.classList.add('bg-primary-container');
            pttIcon.classList.add('text-on-primary-container');
            if (recognition) recognition.start();
            if (socket) socket.emit('ptt_active', true);
        });

        pttBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            pttBtn.classList.remove('bg-primary-container');
            pttIcon.classList.remove('text-on-primary-container');
            if (recognition) recognition.stop();
            if (socket) socket.emit('ptt_active', false);
        });
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', initApp);
    
    // Prevent default scroll behavior for touch interface
    document.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.scrollable')) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
