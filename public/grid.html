<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM Tactical Grid</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#00e639",
              "primary-container": "#00ff41",
              "outline": "#84967e",
              "background": "#131313",
              "surface-container-high": "#2a2a2a",
              "on-surface": "#e5e2e1",
              "secondary-container": "#fd9000",
              "error": "#ffb4ab",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        overscroll-behavior: none;
        background-color: #131313;
        height: 100vh;
        overflow: hidden;
      }
      .tactical-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(6, 1fr);
        height: calc(100vh - 4rem - 5rem);
        gap: 0.5rem;
        padding: 0.5rem;
      }
      .channel-card {
        transition: all 0.2s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .channel-card:active {
        transform: scale(0.98);
        filter: brightness(1.2);
      }
    </style>
</head>
<body class="font-body text-on-surface bg-background select-none">
<!-- TOP APP BAR -->
<header class="w-full border-t-4 border-[#00FF41] bg-[#131313] shadow-[0_0_20px_rgba(0,255,65,0.15)] flex justify-between items-center px-4 h-16 sticky top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00FF41] text-xl">terminal</span>
<span class="font-headline font-bold text-lg tracking-tighter text-[#00FF41]">ST-AUTHORITY</span>
</div>
<div class="flex flex-col items-end font-headline uppercase tracking-widest text-xs text-[#00FF41]">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-zinc-600" id="status-dot"></div>
<span id="session-info">OFFLINE</span>
</div>
<span class="text-[9px] opacity-60" id="device-id">ID: ---</span>
</div>
</header>
<!-- MAIN TACTICAL CANVAS (Zero Scroll) -->
<main class="tactical-grid bg-[#1c1b1b]" id="grid-container">
<!-- Template for 12 channels -->
<script>
        const channels = [
            { id: 1, label: 'STAGE_LEFT' }, { id: 2, label: 'STAGE_RIGHT' },
            { id: 3, label: 'DIRECTOR_W' }, { id: 4, label: 'PRODUCER' },
            { id: 5, label: 'LIGHTING_1' }, { id: 6, label: 'VIDEO_WALL' },
            { id: 7, label: 'RIGGING_M' }, { id: 8, label: 'SPOT_01' },
            { id: 9, label: 'SPOT_02' }, { id: 10, label: 'PYRO_SAFE' },
            { id: 11, label: 'SYSTEM_ERR' }, { id: 12, label: 'SPARE_LINE' }
        ];

        document.write(channels.map(ch => `
            <div id="ch-${ch.id}" class="channel-card bg-surface-container-high relative flex flex-col justify-between p-2.5 rounded-sm border-l-4 border-zinc-700" 
                 onclick="handleTap(${ch.id})" ondblclick="handleDoubleTap(${ch.id})">
                <div class="flex justify-between items-start">
                    <span class="font-headline text-base font-bold text-zinc-400 ch-num">CH ${ch.id < 10 ? '0' + ch.id : ch.id}</span>
                    <span class="text-[9px] font-label text-outline opacity-50 status-text">IDLE</span>
                </div>
                <div class="flex flex-col gap-1">
                    <span class="font-label text-[9px] uppercase tracking-widest text-zinc-500">${ch.label}</span>
                    <div class="h-1 w-full bg-zinc-800 indicator-bar"></div>
                </div>
                <div class="absolute bottom-1 right-1 hidden badge">
                    <span class="text-[8px] font-bold px-1 rounded-sm"></span>
                </div>
            </div>
        `).join(''));
    </script>
</main>
<!-- BOTTOM NAV BAR / PTT CONSOLE -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-4 bg-[#131313] border-t border-[#3b4b37]/20 h-20">
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">settings_input_component</span>
<span class="font-bold text-[9px] tracking-widest uppercase">SYSTEM</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">settings_ethernet</span>
<span class="font-bold text-[9px] tracking-widest uppercase">PATCH</span>
</div>
<!-- CENTRAL PTT BUTTON -->
<div class="flex flex-col items-center justify-center bg-[#00FF41] text-[#007117] rounded-sm px-7 py-2 scale-110 shadow-[0_0_20px_rgba(0,255,65,0.4)] active:scale-100 transition-all cursor-pointer" id="ptt-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-bold text-[10px] tracking-widest uppercase font-label">PTT</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">hub</span>
<span class="font-bold text-[9px] tracking-widest uppercase">COMMS</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 opacity-60">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-bold text-[9px] tracking-widest uppercase">LOGS</span>
</div>
</nav>
<!-- PTT OVERLAY -->
<div class="fixed inset-0 bg-black/80 z-[100] hidden flex flex-col items-center justify-center p-8 text-center" id="ptt-overlay">
<div class="w-24 h-24 rounded-full border-4 border-[#00FF41] flex items-center justify-center mb-6 animate-pulse">
<span class="material-symbols-outlined text-4xl text-[#00FF41]">mic</span>
</div>
<h2 class="font-headline text-[#00FF41] text-2xl font-bold mb-2 uppercase tracking-tighter">Broadcasting...</h2>
<p class="text-zinc-400 font-label text-sm">Release to send audio package</p>
</div>
<script>
    const socket = io();
    const session = JSON.parse(localStorage.getItem('av_session') || '{}');
    let tapTimeout = null;

    // UI Updates
    if (session.role) {
        document.getElementById('session-info').innerText = `${session.role} | ${session.roomID} | ${session.pin}`;
        document.getElementById('device-id').innerText = `ID: ${Math.random().toString(36).substr(2, 5).toUpperCase()}-PX`;
    }

    // Socket Lifecycle
    socket.on('connect', () => {
        document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-[#00FF41] shadow-[0_0_8px_#00FF41]';
        socket.emit('join_room', { 
            roomID: session.roomID, 
            pin: session.pin, 
            role: session.role 
        });
    });

    socket.on('joined_success', (data) => {
        console.log('Joined session:', data);
    });

    socket.on('channel_updated', (update) => {
        updateChannelUI(update.channelId, update.status);
    });

    function updateChannelUI(chId, status) {
        const el = document.getElementById(`ch-${chId}`);
        if (!el) return;

        const num = el.querySelector('.ch-num');
        const stText = el.querySelector('.status-text');
        const bar = el.querySelector('.indicator-bar');
        const badge = el.querySelector('.badge');

        // Reset
        el.className = "channel-card bg-surface-container-high relative flex flex-col justify-between p-2.5 rounded-sm border-l-4 border-zinc-700";
        num.className = "font-headline text-base font-bold text-zinc-400 ch-num";
        stText.innerText = status;
        bar.className = "h-1 w-full bg-zinc-800 indicator-bar";
        badge.classList.add('hidden');

        if (status === 'READY') {
            el.classList.replace('border-zinc-700', 'border-primary-container');
            num.classList.replace('text-zinc-400', 'text-primary-container');
            bar.classList.replace('bg-zinc-800', 'bg-primary-container shadow-[0_0_10px_rgba(0,255,65,0.4)]');
            badge.classList.remove('hidden');
            badge.children[0].className = "text-[8px] font-bold text-on-primary-container bg-primary-container px-1 rounded-sm";
            badge.children[0].innerText = "READY";
        } else if (status === 'ALERT') {
            el.classList.replace('border-zinc-700', 'border-secondary-container');
            num.classList.replace('text-zinc-400', 'text-secondary-container');
            bar.classList.replace('bg-zinc-800', 'bg-secondary-container');
            badge.classList.remove('hidden');
            badge.children[0].className = "text-[8px] font-bold text-on-secondary-container bg-secondary-container px-1 rounded-sm";
            badge.children[0].innerText = "ALERT";
        } else if (status === 'EMERGENCY') {
            el.classList.replace('border-zinc-700', 'border-error');
            num.classList.replace('text-zinc-400', 'text-error');
            bar.classList.replace('bg-zinc-800', 'bg-error animate-pulse');
        }
    }

    // Interaction Handlers
    function handleTap(id) {
        if (tapTimeout) {
            clearTimeout(tapTimeout);
            tapTimeout = null;
            return; // handleDoubleTap will take over
        }
        tapTimeout = setTimeout(() => {
            socket.emit('update_channel', { channelId: id, status: 'READY' });
            tapTimeout = null;
        }, 250);
    }

    function handleDoubleTap(id) {
        if (tapTimeout) clearTimeout(tapTimeout);
        tapTimeout = null;
        socket.emit('update_channel', { channelId: id, status: 'ALERT' });
    }

    // PTT Logic
    const pttBtn = document.getElementById('ptt-btn');
    const overlay = document.getElementById('ptt-overlay');
    let pttTimer;

    function startPTT() {
        overlay.classList.remove('hidden');
        pttTimer = setTimeout(stopPTT, 3000);
    }

    function stopPTT() {
        clearTimeout(pttTimer);
        overlay.classList.add('hidden');
    }

    pttBtn.addEventListener('mousedown', startPTT);
    pttBtn.addEventListener('mouseup', stopPTT);
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startPTT(); });
    pttBtn.addEventListener('touchend', stopPTT);

</script>
</body></html>
