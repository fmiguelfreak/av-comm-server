<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
        // Data Handling Logic
        const defaultData = {
            showId: localStorage.getItem('showId') || '8821',
            pin: localStorage.getItem('pin') || '4401',
            role: localStorage.getItem('av_comm_role') || 'A1 - LEAD',
            channels: parseInt(localStorage.getItem('av_comm_channels')) || 12
        };

        // Render Header Info
        document.getElementById('display-id-pin').innerText = `ID: ${defaultData.showId} | PIN: ${defaultData.pin}`;
        document.getElementById('display-role').innerText = defaultData.role;

        // Dynamic Grid Generation
        const grid = document.getElementById('channel-grid');
        const channelNames = [
            "DIRECTOR", "PRODUCER", "LIGHTING", "STAGE MGMT", 
            "VIDEO OP", "AUDIO 1", "AUDIO 2", "VFX LEAD", 
            "BACKSTAGE", "SECURITY", "RIGGING", "FOYER"
        ];

        function renderGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= defaultData.channels; i++) {
                const isAlert = i === 2 || i === 8; // Mock alert states
                const statusColor = isAlert ? 'bg-error' : 'bg-primary-container';
                const textColor = isAlert ? 'text-error' : 'text-primary-container';
                const borderColor = isAlert ? 'border-error-container' : 'border-primary-container';
                const statusText = isAlert ? 'ALERT STATE' : 'ACTIVE LINK';
                const icon = isAlert ? 'warning' : 'signal_cellular_alt';
                const name = channelNames[i-1] || `CHANNEL ${i.toString().padStart(2, '0')}`;

                const card = document.createElement('div');
                card.className = `bg-surface-container-low relative flex flex-col justify-between p-3 border-l-4 ${borderColor} group hover:bg-surface-container-high transition-colors cursor-pointer active:bg-surface-container-highest`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-medium">CH ${i.toString().padStart(2, '0')}</span>
<span class="material-symbols-outlined ${textColor} text-lg">${icon}</span>
</div>
<div class="mt-auto">
<h3 class="font-headline font-bold text-base leading-tight text-white truncate pr-2">${name}</h3>
<p class="font-label text-[9px] ${textColor} mt-1 opacity-80 tracking-tighter">${statusText}</p>
</div>
<div class="absolute top-0 right-0 w-1 h-full ${statusColor}"></div>
                `;
                grid.appendChild(card);
            }
        }

        renderGrid();
    </script>
