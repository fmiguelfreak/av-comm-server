<script>
let socket;
let config;

function initApp() {
    config = JSON.parse(localStorage.getItem('av_comm_config'));

    if (!config) {
        alert("Sem sessão. Voltar ao setup.");
        window.location.href = "config.html";
        return;
    }

    document.getElementById('header-role').textContent = config.role;
    document.getElementById('header-id').textContent = config.id;
    document.getElementById('header-pin').textContent = config.pin;
    document.getElementById('session-display').textContent = `SESSION: ${config.id}`;

    socket = io("https://av-comm-server-production.up.railway.app");

    socket.on('connect', () => {
        console.log("Ligado ao servidor");

        socket.emit('join_room', {
            roomID: config.id,
            pin: config.pin,
            role: config.role
        });
    });

    socket.on('joined_success', (data) => {
        console.log("Joined:", data);
    });

    socket.on('channel_updated', (data) => {
        console.log("Channel update:", data);
        // aqui depois ligamos à UI
    });

    setupPTT();
}

function setupPTT() {
    const btn = document.getElementById('ptt-button');

    btn.addEventListener('mousedown', () => {
        socket.emit('update_channel', {
            roomID: config.id,
            chID: config.role,
            status: 'ACTIVE'
        });
    });

    btn.addEventListener('mouseup', () => {
        socket.emit('update_channel', {
            roomID: config.id,
            chID: config.role,
            status: 'IDLE'
        });
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
