<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM Tactical Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "#00ff41",
              "secondary-container": "#fd9000",
              "surface": "#131313",
              "on-surface": "#e5e2e1",
              "on-surface-variant": "#b9ccb2",
              "error-container": "#93000a",
              "primary-fixed": "#72ff70",
              "secondary-fixed": "#ffb778",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #131313;
            color: #e5e2e1;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        main {
            height: calc(100dvh - 56px - 64px);
        }
        .channel-btn.state-ready { border-left-color: #00ff41; opacity: 1; }
        .channel-btn.state-alert { border-left-color: #fd9000; opacity: 1; }
        .channel-btn.state-idle { border-left-color: #3b4b37; opacity: 0.5; }
    </style>
</head>
<body class="flex flex-col font-body bg-[#131313]">
<!-- TOP APP BAR -->
<header class="h-14 bg-[#131313] border-b-2 border-[#00FF41] flex justify-between items-center w-full px-4 z-50 shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00FF41] text-xl" data-icon="terminal">terminal</span>
<h1 class="font-headline uppercase tracking-widest text-[10px] text-[#00FF41] opacity-70" id="session-display">SYNCING...</h1>
</div>
<button class="flex items-center gap-3 bg-[#1c1b1b] px-4 py-1.5 rounded-sm border border-[#00FF41]/30 active:bg-[#2a2a2a] transition-colors" id="role-toggle">
<span class="font-headline font-bold tracking-tighter text-[#00FF41] text-sm uppercase" id="header-role">---</span>
<span class="text-[10px] text-[#00FF41]/40">|</span>
<span class="font-headline text-xs tracking-tight text-[#00FF41]" id="header-id">----</span>
<span class="text-[10px] text-[#00FF41]/40">|</span>
<span class="font-headline text-xs tracking-tight text-[#00FF41]" id="header-pin">----</span>
</button>
</header>
<!-- MAIN OPERATIONAL GRID (12 CHANNELS) -->
<main class="flex-grow p-2 grid grid-cols-2 grid-rows-6 gap-1.5 bg-[#0e0e0e] overflow-hidden" id="channel-grid">
<!-- Channels injected via JS -->
</main>
<!-- BOTTOM NAVIGATION -->
<nav class="bg-[#0e0e0e] w-full flex justify-between items-center px-4 h-16 shrink-0 z-50 border-t border-[#00FF41]/10">
<div class="flex gap-6">
<a class="flex flex-col items-center justify-center text-[#00FF41]" href="#">
<span class="material-symbols-outlined text-xl" data-icon="hub">hub</span>
<span class="font-label text-[8px] uppercase font-black tracking-tighter">Channels</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 hover:text-[#00FF41]" href="#">
<span class="material-symbols-outlined text-xl" data-icon="forum">forum</span>
<span class="font-label text-[8px] uppercase font-black tracking-tighter">Chat</span>
</a>
</div>
<!-- PTT BUTTON -->
<div class="relative flex flex-col items-center">
<button class="relative -top-3 h-16 w-16 bg-[#131313] border-2 border-primary-container rounded-full flex items-center justify-center active:bg-primary-container transition-all shadow-[0_0_20px_rgba(0,255,65,0.2)]" id="ptt-button">
<span class="material-symbols-outlined text-2xl text-primary-container active:text-on-primary-container" data-icon="mic" id="ptt-icon" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<div class="absolute top-14 text-[9px] text-[#00FF41] font-headline uppercase truncate w-32 text-center opacity-0 transition-opacity" id="ptt-transcript">LISTENING...</div>
</div>
<div class="flex gap-6">
<a class="flex flex-col items-center justify-center text-gray-500 hover:text-[#00FF41]" href="#">
<span class="material-symbols-outlined text-xl" data-icon="notifications">notifications</span>
<span class="font-label text-[8px] uppercase font-black tracking-tighter">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 hover:text-[#00FF41]" href="#">
<span class="material-symbols-outlined text-xl" data-icon="settings">settings</span>
<span class="font-label text-[8px] uppercase font-black tracking-tighter">Setup</span>
</a>
</div>
</nav>
<!-- GRID OVERLAY -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]" style="background-image: radial-gradient(#00FF41 1px, transparent 1px); background-size: 20px 20px;"></div>
<script>
    const ROLES = ['FOH', 'BOH', 'MICS', 'CUSTOM'];
    let socket;
    let session = JSON.parse(localStorage.getItem('av_comm_session') || '{}');
    
    const grid = document.getElementById('channel-grid');
    const roleEl = document.getElementById('header-role');
    const idEl = document.getElementById('header-id');
    const pinEl = document.getElementById('header-pin');
    const sessionDisplay = document.getElementById('session-display');

    function initSocket() {
        if (!session.id) {
            console.error("No session found in localStorage");
            return;
        }

        socket = io("https://av-comm-server-production.up.railway.app");

        socket.on('connect', () => {
            socket.emit('join_room', { 
                roomID: session.id, 
                pin: session.pin, 
                role: session.role || 'FOH' 
            });
        });

        socket.on('joined_success', (data) => {
            idEl.textContent = data.roomID;
            pinEl.textContent = session.pin;
            roleEl.textContent = session.role || 'FOH';
            sessionDisplay.textContent = `SESSION: ${data.roomID}`;
            renderGrid(data.channels || 12);
        });

        socket.on('channel_update', (data) => {
            updateChannelUI(data.channelId, data.status);
        });
    }

    function renderGrid(count) {
        grid.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const chId = i.toString().padStart(2, '0');
            const btn = document.createElement('button');
            btn.className = `channel-btn state-idle bg-[#201f1f] rounded-sm p-2 flex flex-col justify-between items-start border-l-4 relative overflow-hidden active:scale-[0.98] transition-all min-h-0`;
            btn.id = `ch-${chId}`;
            
            btn.innerHTML = `
                <div class="w-full flex justify-between items-start">
                    <span class="font-headline text-[8px] text-on-surface-variant font-bold">CH ${chId}</span>
                    <span class="status-tag text-[7px] font-black px-1 rounded-sm uppercase bg-black/40" id="tag-${chId}">IDLE</span>
                </div>
                <h2 class="ch-name font-headline font-bold text-base text-on-surface leading-none uppercase truncate w-full text-left" id="name-${chId}">CHANNEL ${chId}</h2>
            `;

            // Interaction Logic: Single tap READY, Double tap ALERT
            let timer = null;
            btn.addEventListener('click', () => {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                    handleStatusChange(chId, 'ALERT');
                } else {
                    timer = setTimeout(() => {
                        handleStatusChange(chId, 'READY');
                        timer = null;
                    }, 250);
                }
            });

            grid.appendChild(btn);
        }
    }

    function handleStatusChange(id, status) {
        if (socket) socket.emit('update_status', { channelId: id, status: status });
        updateChannelUI(id, status);
    }

    function updateChannelUI(id, status) {
        const btn = document.getElementById(`ch-${id}`);
        const tag = document.getElementById(`tag-${id}`);
        const name = document.getElementById(`name-${id}`);
        if (!btn) return;

        btn.classList.remove('state-ready', 'state-alert', 'state-idle');
        tag.classList.remove('text-primary-container', 'text-secondary-container', 'text-on-surface-variant');
        name.classList.remove('text-primary-fixed', 'text-secondary-fixed', 'text-on-surface');

        if (status === 'READY') {
            btn.classList.add('state-ready');
            tag.classList.add('text-primary-container');
            tag.textContent = 'READY';
            name.classList.add('text-primary-fixed');
        } else if (status === 'ALERT') {
            btn.classList.add('state-alert');
            tag.classList.add('text-secondary-container');
            tag.textContent = 'ALERT';
            name.classList.add('text-secondary-fixed');
        } else {
            btn.classList.add('state-idle');
            tag.classList.add('text-on-surface-variant');
            tag.textContent = 'IDLE';
            name.classList.add('text-on-surface');
        }
    }

    // Role Toggle Logic
    document.getElementById('role-toggle').addEventListener('click', () => {
        let currentRole = roleEl.textContent;
        let nextIndex = (ROLES.indexOf(currentRole) + 1) % ROLES.length;
        let nextRole = ROLES[nextIndex];
        
        session.role = nextRole;
        localStorage.setItem('av_comm_session', JSON.stringify(session));
        roleEl.textContent = nextRole;
        
        if (socket && socket.connected) {
            socket.emit('join_room', { roomID: session.id, pin: session.pin, role: nextRole });
        }
    });

    // PTT Voice-to-Text Logic
    const pttBtn = document.getElementById('ptt-button');
    const pttIcon = document.getElementById('ptt-icon');
    const pttTranscript = document.getElementById('ptt-transcript');
    
    let recognition;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            pttTranscript.textContent = transcript;
            pttTranscript.classList.remove('opacity-0');
        };

        recognition.onend = () => {
            const finalMsg = pttTranscript.textContent;
            if (finalMsg && finalMsg !== 'LISTENING...') {
                if (socket) socket.emit('voice_message', { text: finalMsg, role: session.role });
            }
            setTimeout(() => {
                pttTranscript.classList.add('opacity-0');
                pttTranscript.textContent = 'LISTENING...';
            }, 2000);
        };
    }

    const startPTT = (e) => {
        e.preventDefault();
        pttBtn.classList.add('bg-primary-container');
        pttIcon.classList.add('text-on-primary-container');
        pttTranscript.classList.remove('opacity-0');
        if (recognition) recognition.start();
        if (socket) socket.emit('ptt_active', true);
    };

    const stopPTT = (e) => {
        e.preventDefault();
        pttBtn.classList.remove('bg-primary-container');
        pttIcon.classList.remove('text-on-primary-container');
        if (recognition) recognition.stop();
        if (socket) socket.emit('ptt_active', false);
    };

    pttBtn.addEventListener('touchstart', startPTT);
    pttBtn.addEventListener('touchend', stopPTT);
    pttBtn.addEventListener('mousedown', startPTT);
    pttBtn.addEventListener('mouseup', stopPTT);

    window.addEventListener('DOMContentLoaded', initSocket);

    // Prevent scroll bounce on iOS
    document.addEventListener('touchmove', (e) => {
        if (e.target.closest('main') === null) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
</body></html>
