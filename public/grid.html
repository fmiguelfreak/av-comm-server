<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const socket = io();

    const sessionRaw = localStorage.getItem('av_session');

    if (!sessionRaw) {
        window.location.href = "/";
        return;
    }

    const session = JSON.parse(sessionRaw);

    // HEADER
    const idEl = document.getElementById('header-id');
    const pinEl = document.getElementById('header-pin');

    if (idEl) idEl.innerText = session.roomID;
    if (pinEl) pinEl.innerText = session.pin;

    // JOIN ROOM
    socket.emit('join_room', {
        roomID: session.roomID,
        pin: session.pin,
        role: "CLIENT"
    });

    // GRID
    const grid = document.getElementById('channel-grid');
    if (!grid) return;

    grid.innerHTML = "";

    for (let i = 1; i <= session.channels; i++) {

        const btn = document.createElement('button');
        btn.className = "bg-surface-container-high p-2";
        btn.innerText = "CH " + i;
        btn.id = "ch_" + i;

        btn.onclick = () => {
            socket.emit('update_channel', {
                roomID: session.roomID,
                chID: i,
                status: "active",
                role: "CLIENT"
            });
        };

        grid.appendChild(btn);
    }

    // REALTIME
    socket.on('channel_updated', (data) => {
        const el = document.getElementById("ch_" + data.chID);
        if (!el) return;

        el.style.background = data.status === "active" ? "#00ff41" : "";
    });

});
</script>
