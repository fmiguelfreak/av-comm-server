<!DOCTYPE html>
<html class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AV-COMM GRID</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body { background:#131313; color:white; }
.channel { transition: all 0.2s; }
.active { background:#00ff41; color:black; }
</style>
</head>

<body class="p-4">

<h1 id="session" class="mb-4 text-green-400"></h1>

<div id="grid" class="grid grid-cols-3 gap-2"></div>

<button id="ptt" class="mt-6 w-full bg-green-500 py-4 text-xl">
PTT
</button>

<script>
const config = JSON.parse(localStorage.getItem("av_comm_config"));

if(!config){
    alert("Sem sessão");
    location.href="index.html";
}

document.getElementById("session").innerText =
`ROOM ${config.id} | PIN ${config.pin}`;

// SOCKET
const socket = io("https://av-comm-server-production.up.railway.app");

socket.on("connect", () => {
    socket.emit("join_room", {
        roomID: config.id,
        pin: config.pin,
        role: config.role
    });
});

// GRID INIT
const grid = document.getElementById("grid");

for(let i=1;i<=config.channels;i++){
    const el = document.createElement("div");
    el.className = "channel bg-gray-800 p-6 text-center";
    el.id = "ch_"+i;
    el.innerText = "CH "+i;
    grid.appendChild(el);
}

// REALTIME UPDATE
socket.on("channel_updated", (data) => {
    const el = document.getElementById("ch_"+data.chID);

    if(!el) return;

    if(data.status === "ACTIVE"){
        el.classList.add("active");
    } else {
        el.classList.remove("active");
    }
});

// PTT
const ptt = document.getElementById("ptt");

ptt.onmousedown = () => {
    socket.emit("update_channel", {
        roomID: config.id,
        chID: 1,
        status: "ACTIVE",
        role: config.role
    });
};

ptt.onmouseup = () => {
    socket.emit("update_channel", {
        roomID: config.id,
        chID: 1,
        status: "IDLE",
        role: config.role
    });
};
</script>

</body>
</html>
