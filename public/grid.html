<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM GRID | SYSTEM OPERATIONAL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary-fixed": "#72ff70",
                "on-secondary-container": "#613400",
                "outline": "#84967e",
                "on-primary-fixed-variant": "#00530e",
                "outline-variant": "#3b4b37",
                "on-surface": "#e5e2e1",
                "error-container": "#93000a",
                "on-primary-fixed": "#002203",
                "on-tertiary": "#621100",
                "surface": "#131313",
                "tertiary-fixed": "#ffdad2",
                "secondary-container": "#fd9000",
                "on-tertiary-container": "#b82a00",
                "on-secondary": "#4c2700",
                "secondary-fixed": "#ffdcc1",
                "on-tertiary-fixed": "#3c0700",
                "surface-tint": "#00e639",
                "on-error": "#690005",
                "on-secondary-fixed": "#2e1500",
                "inverse-surface": "#e5e2e1",
                "secondary-fixed-dim": "#ffb778",
                "tertiary": "#fff8f6",
                "surface-variant": "#353534",
                "surface-dim": "#131313",
                "tertiary-fixed-dim": "#ffb4a2",
                "surface-bright": "#393939",
                "secondary": "#ffb778",
                "inverse-on-surface": "#313030",
                "surface-container": "#201f1f",
                "on-secondary-fixed-variant": "#6c3a00",
                "surface-container-high": "#2a2a2a",
                "on-tertiary-fixed-variant": "#8a1d00",
                "primary-container": "#00ff41",
                "error": "#ffb4ab",
                "tertiary-container": "#ffd3c8",
                "surface-container-lowest": "#0e0e0e",
                "surface-container-low": "#1c1b1b",
                "on-error-container": "#ffdad6",
                "inverse-primary": "#006e16",
                "on-primary-container": "#007117",
                "on-background": "#e5e2e1",
                "background": "#131313",
                "surface-container-highest": "#353534",
                "primary": "#ebffe2",
                "primary-fixed-dim": "#00e639",
                "on-surface-variant": "#b9ccb2",
                "on-primary": "#003907"
              },
              fontFamily: {
                "headline": ["Space Grotesk"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
    </script>
<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            overflow: hidden;
            height: 100dvh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ptt-active {
            box-shadow: 0 0 25px #00ff41;
        }
        /* Ensure the grid fits without scroll */
        #channel-grid {
            height: calc(100dvh - 72px - 80px); /* Total minus header and footer */
        }
    </style>
</head>
<body class="flex flex-col font-body">
<!-- TopAppBar -->
<header class="h-[72px] flex justify-between items-center w-full px-6 bg-[#131313] border-b-4 border-[#00FF41] shadow-[0_0_20px_rgba(0,255,65,0.15)] z-50 shrink-0">
<div class="flex flex-col">
<span class="font-['Space_Grotesk'] tracking-tighter uppercase font-bold text-sm text-[#00FF41]">SYSTEM OPERATIONAL</span>
<div class="flex items-center gap-2 mt-0.5">
<span class="font-headline font-bold text-xs tracking-widest text-neutral-400" id="display-id-pin">ID: ---- | PIN: ----</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="text-[#00FF41] font-headline font-black tracking-widest text-lg hover:opacity-80 transition-opacity uppercase text-right" id="role-toggle">
<span id="display-role">LOADING...</span>
</button>
<div class="w-8 h-8 rounded-sm bg-surface-container-high border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-xs text-primary-fixed-dim">id_card</span>
</div>
</div>
</header>
<!-- Main Grid Canvas -->
<main class="flex-1 p-3 grid grid-cols-2 grid-rows-6 gap-2 overflow-hidden" id="channel-grid">
<!-- JS will populate these 12 modules dynamically -->
</main>
<!-- BottomNavBar -->
<nav class="h-20 w-full z-50 flex justify-around items-center px-4 bg-[#1c1b1b] shadow-[0_-8px_32px_rgba(0,0,0,0.5)] shrink-0">
<button class="flex items-center justify-center text-neutral-500 hover:text-[#00ff41] px-4 transition-all duration-150">
<span class="material-symbols-outlined">settings_remote</span>
</button>
<button class="flex items-center justify-center text-neutral-500 hover:text-[#00ff41] px-4 transition-all duration-150">
<span class="material-symbols-outlined">analytics</span>
</button>
<!-- PTT CENTER ACTION -->
<button class="flex items-center justify-center bg-[#00ff41] text-[#007117] rounded-sm scale-110 shadow-[0_0_15px_#00ff41] px-8 py-4 active:scale-95 transition-all duration-75">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<button class="flex items-center justify-center text-neutral-500 hover:text-[#00ff41] px-4 transition-all duration-150">
<span class="material-symbols-outlined">security</span>
</button>
<button class="flex items-center justify-center text-neutral-500 hover:text-[#00ff41] px-4 transition-all duration-150">
<span class="material-symbols-outlined">terminal</span>
</button>
</nav>
<script>
        // Data Handling Logic
        const roles = ["A1 - LEAD", "A2 - ASSIST", "FOH", "BOH", "SYSTEMS", "PROD"];
        
        const state = {
            showId: localStorage.getItem('showId') || '8821',
            pin: localStorage.getItem('pin') || '4401',
            role: localStorage.getItem('av_comm_role') || 'A1 - LEAD',
            channels: parseInt(localStorage.getItem('av_comm_channels')) || 12
        };

        // UI Elements
        const displayIdPin = document.getElementById('display-id-pin');
        const displayRole = document.getElementById('display-role');
        const roleToggle = document.getElementById('role-toggle');
        const grid = document.getElementById('channel-grid');

        const channelNames = [
            "DIRECTOR", "PRODUCER", "LIGHTING", "STAGE MGMT", 
            "VIDEO OP", "AUDIO 1", "AUDIO 2", "VFX LEAD", 
            "BACKSTAGE", "SECURITY", "RIGGING", "FOYER"
        ];

        // Initialization
        function init() {
            updateHeader();
            renderGrid();
            setupInteractions();
        }

        function updateHeader() {
            displayIdPin.innerText = `ID: ${state.showId} | PIN: ${state.pin}`;
            displayRole.innerText = state.role;
        }

        function setupInteractions() {
            roleToggle.addEventListener('click', () => {
                let currentIndex = roles.indexOf(state.role);
                let nextIndex = (currentIndex + 1) % roles.length;
                state.role = roles[nextIndex];
                localStorage.setItem('av_comm_role', state.role);
                updateHeader();
            });
        }

        function renderGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= state.channels; i++) {
                const isAlert = i === 2 || i === 8; // Mock alert states
                const statusColor = isAlert ? 'bg-error' : 'bg-primary-container';
                const textColor = isAlert ? 'text-error' : 'text-primary-container';
                const borderColor = isAlert ? 'border-error-container' : 'border-primary-container';
                const statusText = isAlert ? 'ALERT STATE' : 'ACTIVE LINK';
                const icon = isAlert ? 'warning' : 'signal_cellular_alt';
                const name = channelNames[i-1] || `CHANNEL ${i.toString().padStart(2, '0')}`;

                const card = document.createElement('div');
                // Added grid-related classes to ensure uniform sizing in the row-based grid
                card.className = `bg-surface-container-low relative flex flex-col justify-between p-2 border-l-4 ${borderColor} group hover:bg-surface-container-high transition-colors cursor-pointer active:bg-surface-container-highest min-h-0`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-label text-[9px] uppercase tracking-widest text-on-surface-variant font-medium">CH ${i.toString().padStart(2, '0')}</span>
                        <span class="material-symbols-outlined ${textColor} text-base">${icon}</span>
                    </div>
                    <div class="mt-auto">
                        <h3 class="font-headline font-bold text-sm leading-tight text-white truncate pr-2 uppercase">${name}</h3>
                        <p class="font-label text-[8px] ${textColor} mt-0.5 opacity-80 tracking-tighter">${statusText}</p>
                    </div>
                    <div class="absolute top-0 right-0 w-1 h-full ${statusColor}"></div>
                `;
                grid.appendChild(card);
            }
        }

        init();
    </script>
</body></html>
