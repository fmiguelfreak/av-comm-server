<!DOCTYPE html>

<html class="dark" lang="en"><head>
<title>Tactical Grid - Signal &amp; Steel</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface": "#0a0a0a",
              "primary-fixed-dim": "#00ff41",
              "outline-variant": "#1a1a1a",
              "surface-container-lowest": "#050505",
              "surface-dim": "#0a0a0a",
              "on-primary": "#000000",
              "primary": "#00ff41",
              "secondary": "#ffb778",
              "on-surface": "#e0e0e0",
              "surface-container-highest": "#1a1a1a",
              "error": "#ff4d4d",
              "surface-container": "#111111",
              "background": "#050505",
              "primary-container": "#00ff41",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0px", "lg": "2px", "xl": "4px", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-user-select: none;
            user-select: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hidden-popup {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        .visible-popup {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        /* Tactical Grid Layout */
        #channel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr;
            height: calc(100vh - 128px); /* 56px header + 72px footer */
            gap: 4px;
            padding: 4px;
            overflow-y: auto;
        }
        .channel-btn {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .state-ready { background-color: #00ff41; color: #000000; }
        .state-alert { background-color: #ff4d4d; color: #ffffff; animation: pulse-red 1s infinite; }
        .state-idle { background-color: #1a1a1a; color: #00ff41; border: 1px solid #00ff4133; }
        
        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="font-body">
<!-- TopAppBar - Tactical Header -->
<header class="bg-surface text-primary font-headline uppercase tracking-tighter border-b-2 border-primary/30 flex justify-between items-center px-4 h-14 w-full fixed top-0 z-40">
<div class="flex flex-col leading-none">
<div class="text-[11px] font-black"><span class="text-primary/60">ID:</span> <span id="header-id">0000</span></div>
<div class="text-[11px] font-black"><span class="text-primary/60">PIN:</span> <span id="header-pin">0000</span></div>
</div>
<div class="flex flex-col items-center">
<span class="text-xs font-black tracking-widest border-2 border-primary px-3 py-0.5 bg-primary/10" id="header-role">UNASSIGNED</span>
</div>
<div class="flex items-center gap-2">
<div class="flex flex-col items-end leading-none">
<span class="text-[8px] font-bold text-primary/60">SYSTEM_SYNC</span>
<span class="text-[10px] font-black" id="sync-status">OFFLINE</span>
</div>
<div class="w-3 h-3 rounded-full bg-error shadow-[0_0_10px_#ff4d4d]" id="sync-indicator"></div>
</div>
</header>
<!-- Main Content Canvas - Dynamic Grid -->
<main class="mt-14 mb-[72px] w-full bg-background overflow-hidden" id="channel-grid">
<!-- Channels will be injected here via JavaScript -->
</main>
<!-- MESSAGE POPUP OVERLAY -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-6 pointer-events-none" id="message-overlay">
<div class="hidden-popup bg-surface-container-highest border-l-[4px] border-primary shadow-[0_20px_50px_rgba(0,0,0,0.9)] p-5 max-w-sm w-full transition-all duration-500" id="message-container">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-3">
<div class="bg-primary p-1.5 rounded-full text-black animate-pulse">
<span class="material-symbols-outlined text-sm block font-bold">chat_bubble</span>
</div>
<span class="font-headline font-bold uppercase tracking-widest text-primary text-xs">PRIORITY COMMS</span>
</div>
</div>
<div class="bg-black/40 p-3 border-l border-primary/30">
<p class="font-body text-on-surface text-sm leading-relaxed" id="msg-content">"WAITING FOR DATA..."</p>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="bg-surface border-t border-white/5 text-primary/40 font-bold text-[9px] uppercase tracking-tighter fixed bottom-0 left-0 w-full h-[72px] z-50 flex justify-around items-center px-4 pb-1">
<div class="flex flex-col items-center justify-center text-primary">
<span class="material-symbols-outlined mb-1 text-xl">grid_view</span>
<span>Grid</span>
</div>
<div class="flex flex-col items-center justify-center">
<span class="material-symbols-outlined mb-1 text-xl">analytics</span>
<span>Meters</span>
</div>
<!-- PTT Button Anchor -->
<div class="relative -top-3">
<div class="bg-background p-1.5 rounded-full border border-white/10">
<button class="bg-primary text-black w-16 h-16 rounded-full flex flex-col items-center justify-center shadow-[0_0_25px_rgba(0,255,65,0.4)] active:scale-95 active:shadow-none transition-all" id="ptt-button">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="text-[8px] font-black mt-[-2px]">TALK</span>
</button>
</div>
</div>
<div class="flex flex-col items-center justify-center relative">
<span class="material-symbols-outlined mb-1 text-xl">notifications</span>
<span>Alerts</span>
<span class="absolute top-0 right-1 w-1.5 h-1.5 bg-error rounded-full"></span>
</div>
<div class="flex flex-col items-center justify-center" onclick="window.location.href='config.html'">
<span class="material-symbols-outlined mb-1 text-xl">settings</span>
<span>Config</span>
</div>
</nav>
<script>
    let config = {
        showId: '0000',
        pin: '0000',
        channels: 12,
        role: 'UNASSIGNED'
    };

    const socket = io('https://tacomamultimedia-production.up.railway.app/');
    const gridContainer = document.getElementById('channel-grid');
    const syncStatus = document.getElementById('sync-status');
    const syncIndicator = document.getElementById('sync-indicator');

    const channelNames = [
        "L_MAIN_ARRAY", "R_MAIN_ARRAY", "SUB_DRIVE", "MON_01_DRUM",
        "LEAD_VOC_01", "BACK_VOC_01", "GTR_STK_A", "GTR_STK_B",
        "COMMS_01", "L_WASH_STG", "R_WASH_STG", "PYRO_MSTR"
    ];

    function renderGrid(count) {
        gridContainer.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const channelId = i.toString().padStart(2, '0');
            const name = channelNames[i-1] || `CH_${channelId}`;
            
            const btn = document.createElement('div');
            btn.className = 'channel-btn state-ready p-2 border border-black/20 relative cursor-pointer';
            btn.setAttribute('data-channel', i);
            btn.setAttribute('data-state', 'READY');
            
            btn.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-headline font-black text-xl leading-none">${channelId}</span>
                    <span class="status-label text-[8px] font-black border border-black/20 px-1 bg-black/5">READY</span>
                </div>
                <div class="font-headline font-bold text-[11px] leading-tight uppercase truncate mt-auto">${name}</div>
            `;

            // Toggle state logic for demonstration/feedback
            let lastTap = 0;
            btn.addEventListener('touchstart', (e) => {
                const now = Date.now();
                const currentState = btn.getAttribute('data-state');
                let newState = 'READY';

                if (now - lastTap < 300) {
                    newState = 'ALERT';
                } else {
                    newState = currentState === 'READY' ? 'IDLE' : 'READY';
                }
                
                updateElementState(btn, newState);
                socket.emit('update_channel', { id: i.toString(), status: newState });
                lastTap = now;
            });
            btn.addEventListener('touchend', (e) => e.preventDefault());

            gridContainer.appendChild(btn);
        }
    }

    function updateElementState(btn, state) {
        const label = btn.querySelector('.status-label');
        btn.setAttribute('data-state', state);
        
        // Reset classes
        btn.classList.remove('state-ready', 'state-alert', 'state-idle');
        
        if (state === 'READY') {
            btn.classList.add('state-ready');
            label.innerText = 'READY';
        } else if (state === 'ALERT') {
            btn.classList.add('state-alert');
            label.innerText = 'ALERT';
        } else {
            btn.classList.add('state-idle');
            label.innerText = 'IDLE';
        }
    }

    window.onload = () => {
        // Fetch from localStorage
        config.showId = localStorage.getItem('av_comm_showId') || '0000';
        config.pin = localStorage.getItem('av_comm_pin') || '0000';
        config.role = localStorage.getItem('av_comm_role') || 'UNASSIGNED';
        config.channels = parseInt(localStorage.getItem('av_comm_channels')) || 12;

        // Update UI
        document.getElementById('header-id').innerText = config.showId;
        document.getElementById('header-pin').innerText = config.pin;
        document.getElementById('header-role').innerText = config.role;

        renderGrid(config.channels);
    };

    socket.on('connect', () => {
        syncStatus.innerText = 'STABLE';
        syncIndicator.className = 'w-3 h-3 rounded-full bg-primary animate-pulse shadow-[0_0_10px_#00ff41]';
    });

    socket.on('disconnect', () => {
        syncStatus.innerText = 'OFFLINE';
        syncIndicator.className = 'w-3 h-3 rounded-full bg-error shadow-[0_0_10px_#ff4d4d]';
    });

    socket.on('state_changed', (channels) => {
        channels.forEach(ch => {
            const btn = document.querySelector(`.channel-btn[data-channel="${ch.id}"]`);
            if (btn) updateElementState(btn, ch.status);
        });
    });

    // PTT Logic
    const pttBtn = document.getElementById('ptt-button');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            socket.emit('new_message', { content: transcript.toUpperCase(), source: config.role });
        };
        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pttBtn.classList.replace('bg-primary', 'bg-white');
            recognition.start();
        });
        pttBtn.addEventListener('touchend', () => {
            pttBtn.classList.replace('bg-white', 'bg-primary');
            recognition.stop();
        });
    }

    // Broadcast messages
    const container = document.getElementById('message-container');
    const contentEl = document.getElementById('msg-content');
    let popupTimer;

    socket.on('broadcast_message', (data) => {
        contentEl.innerText = `"${data.content}"`;
        container.classList.remove('hidden-popup');
        container.classList.add('visible-popup');
        if (popupTimer) clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
            container.classList.remove('visible-popup');
            container.classList.add('hidden-popup');
        }, 3500);
    });
</script>
</body></html>
