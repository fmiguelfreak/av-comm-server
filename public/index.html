<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AV-COMM: Stage Tech Auth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
        :root {
            --brand-primary: #00FF41;
            --brand-dark: #131313;
            --brand-surface: #1c1b1b;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: var(--brand-dark);
            color: #e5e2e1;
            overflow-x: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }
        .glitch-bg {
            background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .font-headline { font-family: 'Inter', sans-serif; }
        .font-label { font-family: 'Space Grotesk', sans-serif; }
        
        @keyframes pulse-glow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .authenticating-glow {
            animation: pulse-glow 1s infinite ease-in-out;
        }
        
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2300FF41' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .rounded-four { border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-[#00FF41] selection:text-black min-h-screen flex flex-col">
<!-- Header -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 bg-[#131313] border-b-2 border-[#00FF41]/30 shadow-[0_0_20px_rgba(0,255,65,0.05)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF41]" data-icon="sensors">sensors</span>
<span class="text-[#00FF41] font-bold tracking-tighter font-headline uppercase text-sm">STAGE_TECH_AUTH</span>
</div>
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-[#00FF41] active:rotate-180 transition-transform duration-500 cursor-pointer" data-icon="sync" onclick="location.reload()">sync</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full flex flex-col md:flex-row items-stretch overflow-hidden glitch-bg" id="app-root">
<!-- CREATE NEW SHOW SECTION -->
<section class="flex-1 flex flex-col justify-center px-8 md:px-16 border-b-2 md:border-b-0 md:border-r-2 border-[#1c1b1b] relative py-12">
<div class="mb-10">
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-[#00FF41]"></div>
<span class="font-label text-xs font-black uppercase tracking-[0.2em] text-[#666]">PROTOCOL_01</span>
</div>
<h2 class="font-headline font-black text-5xl md:text-7xl text-white tracking-tighter leading-none">CREATE<br/>NEW SHOW</h2>
</div>
<div class="space-y-6 max-w-md w-full">
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-[#999] ml-1">ASSIGN SHOW NAME</label>
<input class="w-full bg-[#1c1b1b] border-none focus:ring-1 focus:ring-[#00FF41] text-[#00FF41] font-headline font-medium tracking-tight h-16 px-4 placeholder:text-[#333] uppercase text-lg rounded-four" id="create-show-name" placeholder="E.G. NEON_SUMMIT_2024" type="text"/>
</div>
<button class="group/btn relative w-full h-20 bg-[#00FF41] text-[#004d13] flex items-center justify-between px-6 rounded-four active:scale-[0.98] transition-all hover:shadow-[0_0_30px_rgba(0,255,65,0.3)]" id="btn-create-show">
<span class="font-headline font-black text-2xl tracking-tighter">GENERATE SHOW ID</span>
<span class="material-symbols-outlined text-3xl group-hover/btn:translate-x-2 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none text-white">01</span>
</div>
</section>
<!-- JOIN EXISTING SHOW SECTION -->
<section class="flex-1 flex flex-col justify-center px-8 md:px-16 bg-[#0e0e0e] relative py-12">
<div class="mb-10">
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-[#00FF41]"></div>
<span class="font-label text-xs font-black uppercase tracking-[0.2em] text-[#666]">PROTOCOL_02</span>
</div>
<h2 class="font-headline font-black text-5xl md:text-7xl text-white tracking-tighter leading-none">JOIN<br/>EXISTING</h2>
</div>
<div class="space-y-6 max-w-md w-full">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-[#999] ml-1">SHOW ID</label>
<input class="w-full bg-[#1c1b1b] border-none focus:ring-1 focus:ring-[#00FF41] text-[#00FF41] text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-[#333] rounded-four" id="join-show-id" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="0000" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-[#999] ml-1">ACCESS PIN</label>
<input class="w-full bg-[#1c1b1b] border-none focus:ring-1 focus:ring-[#00FF41] text-[#00FF41] text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-[#333] rounded-four" id="join-show-pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="****" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-[#999] ml-1">SELECT ROLE</label>
<select class="w-full bg-[#1c1b1b] border-none focus:ring-1 focus:ring-[#00FF41] text-[#00FF41] font-headline font-bold h-16 px-4 uppercase text-lg cursor-pointer rounded-four" id="join-role">
<option value="UNASSIGNED">SELECT ROLE...</option>
<option value="A1">A1 - Lead Audio</option>
<option value="A2">A2 - Audio Assistant</option>
<option value="FOH">FOH - Front of House</option>
<option value="MON">MON - Monitors</option>
<option value="TECH">TECH - Systems Tech</option>
<option value="CUSTOM">CUSTOM ROLE...</option>
</select>
</div>
<div class="space-y-2 hidden" id="custom-role-container">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-[#999] ml-1">CUSTOM ROLE NAME</label>
<input class="w-full bg-[#1c1b1b] border-none focus:ring-1 focus:ring-[#00FF41] text-[#00FF41] font-headline font-medium tracking-tight h-16 px-4 placeholder:text-[#333] uppercase text-lg rounded-four" id="join-custom-role" placeholder="E.G. STAGE_HAND" type="text"/>
</div>
<div class="hidden text-xs font-black tracking-widest text-center uppercase py-2" id="auth-status">
<span class="text-[#00FF41]" id="status-text">AUTHENTICATING...</span>
</div>
<button class="w-full h-20 bg-transparent text-white border-2 border-[#1c1b1b] hover:border-[#00FF41] flex items-center justify-center px-6 rounded-four active:scale-[0.98] transition-all group/join disabled:opacity-50 disabled:pointer-events-none" id="btn-join-show">
<span class="font-headline font-black text-2xl tracking-tighter uppercase group-hover:text-[#00FF41] transition-colors" id="btn-join-text">INITIALIZE UPLINK</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none text-white">02</span>
</div>
</section>
</main>
<!-- Mobile Nav Bar (Fixed Bottom) -->
<nav class="md:hidden sticky bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe bg-[#0e0e0e] h-20 border-t-2 border-[#1c1b1b]">
<div class="flex flex-col items-center justify-center bg-[#00FF41] text-[#004d13] rounded-four px-6 py-2 shadow-[0_0_15px_rgba(0,255,65,0.4)] scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">CHANNELS</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2 opacity-50">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">PTT</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2 opacity-50">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">MSGS</span>
</div>
</nav>
<script>
    // Socket.io initialization
    const socket = io('https://av-comm-server-production.up.railway.app');

    // DOM Elements
    const btnCreate = document.getElementById('btn-create-show');
    const btnJoin = document.getElementById('btn-join-show');
    const btnJoinText = document.getElementById('btn-join-text');
    const createNameInput = document.getElementById('create-show-name');
    const joinIdInput = document.getElementById('join-show-id');
    const joinPinInput = document.getElementById('join-show-pin');
    const joinRoleSelect = document.getElementById('join-role');
    const customRoleContainer = document.getElementById('custom-role-container');
    const customRoleInput = document.getElementById('join-custom-role');
    const authStatus = document.getElementById('auth-status');
    const statusText = document.getElementById('status-text');

    // Handle Custom Role Toggle
    joinRoleSelect.addEventListener('change', (e) => {
        if (e.target.value === 'CUSTOM') {
            customRoleContainer.classList.remove('hidden');
        } else {
            customRoleContainer.classList.add('hidden');
        }
    });

    // Action: Create Show
    btnCreate.addEventListener('click', () => {
        const name = createNameInput.value.trim() || 'UNNAMED_SHOW';
        
        // Strictly numeric 4-digit generation
        const generatedId = Math.floor(1000 + Math.random() * 9000).toString();
        const generatedPin = Math.floor(1000 + Math.random() * 9000).toString();

        localStorage.setItem('av_comm_name', name);
        localStorage.setItem('av_comm_id', generatedId);
        localStorage.setItem('av_comm_pin', generatedPin);
        localStorage.setItem('av_comm_role', 'ADMIN');
        localStorage.setItem('av_comm_channels', '12');

        // Redirect to configuration or dashboard
        window.location.href = 'config.html';
    });

    // Action: Join Show
    btnJoin.addEventListener('click', () => {
        const showId = joinIdInput.value.trim();
        const pin = joinPinInput.value.trim();
        
        let role = joinRoleSelect.value;
        if (role === 'CUSTOM') {
            role = customRoleInput.value.trim().toUpperCase() || 'CUSTOM_TECH';
        } else if (role === 'UNASSIGNED') {
            role = 'UNASSIGNED';
        }

        if (showId.length === 4 && pin.length === 4) {
            setLoading(true);
            
            // Temporary storage pending success
            sessionStorage.setItem('pending_join_id', showId);
            sessionStorage.setItem('pending_join_pin', pin);
            sessionStorage.setItem('pending_join_role', role);
            
            // Emit join event to server
            socket.emit('join_show', { showId, pin, role });
        } else {
            showError('PROTOCOL ERROR: 4-DIGIT INPUT REQUIRED');
        }
    });

    // Socket Events
    socket.on('join_success', (data) => {
        // Retrieve values from temporary storage or response
        const showId = sessionStorage.getItem('pending_join_id') || data.showId;
        const pin = sessionStorage.getItem('pending_join_pin') || data.pin;
        const role = sessionStorage.getItem('pending_join_role') || data.role;
        
        // Save to persistent localStorage
        localStorage.setItem('av_comm_id', showId);
        localStorage.setItem('av_comm_pin', pin);
        localStorage.setItem('av_comm_role', role);
        localStorage.setItem('av_comm_channels', data.channels || '12');
        
        // Clear temp storage
        sessionStorage.removeItem('pending_join_id');
        sessionStorage.removeItem('pending_join_pin');
        sessionStorage.removeItem('pending_join_role');

        window.location.href = 'grid.html';
    });

    socket.on('error', (message) => {
        setLoading(false);
        showError(message.toUpperCase() || 'INVALID ID/PIN');
    });

    socket.on('connect_error', () => {
        setLoading(false);
        showError('UPLINK CONNECTION FAILED');
    });

    // UI Helpers
    function setLoading(isLoading) {
        if (isLoading) {
            btnJoin.disabled = true;
            btnJoinText.innerText = 'INITIALIZING...';
            authStatus.classList.remove('hidden');
            statusText.innerText = 'AUTHENTICATING...';
            statusText.className = 'text-[#00FF41] authenticating-glow';
        } else {
            btnJoin.disabled = false;
            btnJoinText.innerText = 'INITIALIZE UPLINK';
            authStatus.classList.add('hidden');
        }
    }

    function showError(msg) {
        authStatus.classList.remove('hidden');
        statusText.innerText = msg;
        statusText.className = 'text-red-500 font-black';
        
        setTimeout(() => {
            if (!btnJoin.disabled) {
                authStatus.classList.add('hidden');
            }
        }, 3000);
    }

    // Input Sanitization
    [joinIdInput, joinPinInput].forEach(input => {
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    });

    socket.on('connect', () => {
        console.log('Uplink synchronized:', socket.id);
    });
</script>
</body></html>
