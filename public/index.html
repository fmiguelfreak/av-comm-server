<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AV-COMM: Stage Tech Auth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script id="tailwind-config">
        // Socket.io initialization
        const socket = io('https://av-comm-server-production.up.railway.app');

        // DOM Elements
        const btnCreate = document.getElementById('btn-create-show');
        const btnJoin = document.getElementById('btn-join-show');
        const btnJoinText = document.getElementById('btn-join-text');
        const createNameInput = document.getElementById('create-show-name');
        const joinIdInput = document.getElementById('join-show-id');
        const joinPinInput = document.getElementById('join-show-pin');

        // Action: Create Show
        btnCreate.addEventListener('click', () => {
            const name = createNameInput.value.trim() || 'UNNAMED_SHOW';
            localStorage.setItem('av_comm_name', name);
            localStorage.setItem('av_comm_pending_role', 'true');
            window.location.href = 'config.html';
        });

        // Action: Join Show
        btnJoin.addEventListener('click', () => {
            const showId = joinIdInput.value.trim();
            const pin = joinPinInput.value.trim();

            if (showId.length === 4 && pin.length === 4) {
                // UI Authenticating State
                btnJoin.disabled = true;
                btnJoinText.innerText = 'AUTHENTICATING...';

                // Save to localStorage
                localStorage.setItem('av_comm_id', showId);
                localStorage.setItem('av_comm_pin', pin);
                // Set flag to prompt role selection in grid.html
                localStorage.setItem('av_comm_pending_role', 'true');

                // Redirect
                window.location.href = 'grid.html';
            } else {
                alert('PROTOCOL ERROR: Show ID and PIN must be 4 digits.');
            }
        });

        // Input Sanitization
        [joinIdInput, joinPinInput].forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });

        // Basic connection logging for debugging
        socket.on('connect', () => {
            console.log('Uplink synchronized:', socket.id);
        });
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #131313;
        color: #e5e2e1;
        overflow-x: hidden;
      }
      .glitch-bg {
        background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .signal-steel-gradient {
        background: linear-gradient(180deg, #131313 0%, #0e0e0e 100%);
      }
    </style>
</head>

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF41]" data-icon="sensors">sensors</span>
<span class="text-[#00FF41] font-bold tracking-tighter font-headline uppercase text-sm">STAGE_TECH_AUTH</span>

<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-primary-container"></div>

<span class="font-headline font-black text-2xl tracking-tighter">GENERATE SHOW ID</span>
<span class="material-symbols-outlined text-3xl group-hover/btn:translate-x-2 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none">01</span>
</div>
</section>
<!-- JOIN EXISTING SHOW SECTION -->
<section class="flex-1 flex flex-col justify-center px-8 md:px-16 bg-surface-container-lowest relative py-12">
<div class="mb-10">
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-secondary-container"></div>
<span class="font-label text-xs font-black uppercase tracking-[0.2em] text-outline">PROTOCOL_02</span>
</div>
<h2 class="font-headline font-bold text-5xl md:text-7xl text-on-surface tracking-tighter leading-none">JOIN<br/>EXISTING</h2>
</div>
<div class="space-y-8 max-w-md w-full">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-on-surface-variant ml-1 uppercase">Show ID</label>
<input class="w-full bg-surface-container-high border-none focus:ring-0 focus:border-l-4 focus:border-secondary-fixed text-secondary text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-outline-variant/20" id="join-show-id" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="0000" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-on-surface-variant ml-1 uppercase">Access PIN</label>
<input class="w-full bg-surface-container-high border-none focus:ring-0 focus:border-l-4 focus:border-secondary-fixed text-secondary text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-outline-variant/20" id="join-show-pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="****" type="password"/>
</div>
</div>
<button class="w-full h-20 bg-surface-container-high text-on-surface border-2 border-transparent hover:border-secondary-container flex items-center justify-center px-6 rounded-sm active:scale-[0.98] transition-all group/join disabled:opacity-50" id="btn-join-show">
<span class="font-headline font-black text-2xl tracking-tighter uppercase group-hover/join:text-secondary transition-colors" id="btn-join-text">INITIALIZE UPLINK</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none">02</span>
</div>
</section>
</main>
<!-- Mobile Nav Bar (Fixed Bottom) -->
<nav class="md:hidden sticky bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe bg-[#0e0e0e] h-20 border-t-2 border-[#1c1b1b]">
<div class="flex flex-col items-center justify-center bg-[#00FF41] text-[#007117] rounded-sm px-6 py-2 shadow-[0_0_15px_rgba(0,255,65,0.4)] scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">CHANNELS</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">PTT</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">MSGS</span>
</div>
</nav>

        const socket = io('https://av-comm-server-production.up.railway.app');

</body></html>
