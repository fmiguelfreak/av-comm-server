<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io();

// CREATE
document.getElementById('btn-generate').addEventListener('click', () => {
    const prodName = document.getElementById('prod-name-input').value || 'SHOW';

    socket.emit('create_room', {
        showName: prodName,
        channels: 12
    });
});

// JOIN
document.getElementById('btn-authorize').addEventListener('click', () => {
    const roomID = document.getElementById('room-id-input').value;
    const pin = document.getElementById('pin-input').value;

    socket.emit('join_room', { roomID, pin });
});

// RESPONSES
socket.on('room_created', (data) => {
    saveSession(data);
    window.location.href = "config.html";
});

socket.on('joined_success', (data) => {
    saveSession(data);
    window.location.href = "grid.html";
});

socket.on('error_msg', (msg) => {
    alert(msg);
});

function saveSession(data){
    localStorage.setItem('av_session', JSON.stringify({
        roomID: data.roomID,
        pin: data.pin,
        channels: data.channels
    }));
}
</script>
