<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>STAGE_TECH_AUTH // SIGNAL &amp; STEEL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00FF41",
                        "signal": "#00FF41",
                        "steel": "#4b5563",
                        "on-primary": "#000000",
                        "background": "#050505",
                        "surface": "#0a0a0a",
                        "surface-variant": "#1a1a1a",
                        "outline": "#333333"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { overflow-x: hidden; min-height: 100vh; background-color: #050505; }
        .tactical-glow { box-shadow: 0 0 15px rgba(0, 255, 65, 0.15); }
        .neon-border { border: 1px solid #333333; transition: all 0.2s ease; }
        .neon-border:focus-within { border-color: #00FF41; box-shadow: 0 0 8px rgba(0, 255, 65, 0.2); }
        .steel-divider { height: 1px; background: linear-gradient(90deg, transparent, #4b5563, transparent); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        .loading-shimmer { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-background text-signal font-body select-none pb-24">
<!-- Top Bar -->
<header class="fixed top-0 left-0 w-full h-16 bg-background border-b border-outline z-50 flex items-center justify-between px-6">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-signal status-pulse"></div>
<h1 class="font-headline font-bold tracking-[0.2em] text-sm uppercase">Stage_Tech_Auth</h1>
</div>
<div class="flex items-center gap-4 text-steel">
<span class="material-symbols-outlined text-sm" data-icon="hub">hub</span>
<span class="font-headline text-[10px] font-bold tracking-widest">OPS-9</span>
</div>
</header>
<main class="pt-24 px-6 max-w-md mx-auto space-y-8">
<!-- Protocol 01: Create -->
<section class="space-y-4" id="create-section">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="text-[10px] font-bold text-steel tracking-tighter uppercase">P_01</span>
<h2 class="font-headline font-bold text-lg uppercase tracking-tight text-white">Initialize Show</h2>
</div>
</div>
<div class="space-y-4 bg-surface p-5 border border-outline rounded-sm">
<div class="space-y-1">
<label class="text-[9px] font-black uppercase tracking-[0.2em] text-steel">Production Identity</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-signal placeholder:text-outline uppercase font-headline font-bold text-sm" id="create-name" placeholder="ASSIGN NAME" type="text"/>
</div>
</div>
<button class="w-full bg-signal text-on-primary font-headline font-black py-4 tactical-glow active:scale-[0.98] transition-all uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-3" onclick="handleCreate()">
                Generate Show ID
                <span class="material-symbols-outlined text-sm" data-icon="double_arrow">double_arrow</span>
</button>
</div>
</section>
<!-- Tactical Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow steel-divider"></div>
<span class="mx-6 text-[9px] font-black text-steel tracking-[0.5em] uppercase">Connect_Link</span>
<div class="flex-grow steel-divider"></div>
</div>
<!-- Protocol 02: Join -->
<section class="space-y-4" id="join-section">
<div class="flex items-center gap-2">
<span class="text-[10px] font-bold text-steel tracking-tighter uppercase">P_02</span>
<h2 class="font-headline font-bold text-lg uppercase tracking-tight text-white">Join Uplink</h2>
</div>
<div class="space-y-4 bg-surface p-5 border border-outline rounded-sm relative overflow-hidden">
<!-- Loading Overlay -->
<div class="hidden absolute inset-0 bg-black/80 z-10 flex flex-col items-center justify-center space-y-3" id="auth-overlay">
<div class="w-12 h-1 loading-shimmer"></div>
<span class="text-[10px] font-headline font-bold tracking-[0.3em] text-signal animate-pulse">AUTHORIZING_PROTOCOL</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-[9px] font-black uppercase tracking-[0.2em] text-steel">Room ID</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-signal placeholder:text-outline text-center text-lg font-headline font-bold tracking-[0.3em]" id="join-id" maxlength="4" placeholder="0000" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="text-[9px] font-black uppercase tracking-[0.2em] text-steel">Secure PIN</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-signal placeholder:text-outline text-center text-lg font-headline font-bold tracking-[0.3em]" id="join-pin" maxlength="4" placeholder="****" type="password"/>
</div>
</div>
</div>
<div class="hidden text-[10px] font-bold text-red-500 uppercase tracking-widest text-center py-1" id="error-display">
                ERROR: INVALID_LINK_PARAMETERS
            </div>
<button class="w-full bg-surface-variant text-signal border border-outline font-headline font-black py-4 active:scale-[0.98] transition-all uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-3 group" onclick="handleJoin()">
                Authorize Uplink
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="login">login</span>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation (Static for Index) -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-background border-t border-outline flex items-center justify-around px-2 z-50">
<div class="flex flex-col items-center justify-center text-signal bg-signal/5 border border-signal/20 rounded-sm p-3 w-16">
<span class="material-symbols-outlined text-xl" data-icon="sensors">sensors</span>
</div>
<div class="flex flex-col items-center justify-center text-steel p-3 w-16 opacity-50">
<span class="material-symbols-outlined text-xl" data-icon="grid_view">grid_view</span>
</div>
<div class="flex flex-col items-center justify-center text-steel p-3 w-16 opacity-50">
<span class="material-symbols-outlined text-xl" data-icon="monitoring">monitoring</span>
</div>
<div class="flex flex-col items-center justify-center text-steel p-3 w-16 opacity-50">
<span class="material-symbols-outlined text-xl" data-icon="settings">settings</span>
</div>
</nav>
<!-- System Stats -->
<div class="fixed bottom-24 right-4 flex flex-col items-end pointer-events-none opacity-30 select-none">
<span class="font-headline text-[7px] tracking-widest uppercase">Kernel: S_STEEL_9.0</span>
<span class="font-headline text-[7px] tracking-widest uppercase">Buffer: 1024_MS</span>
</div>
<script>
    const SERVER_URL = 'https://av-comm-server-production.up.railway.app';
    let socket = null;

    function handleCreate() {
        const name = document.getElementById('create-name').value;
        if (!name) {
            triggerError('create-name');
            return;
        }
        
        localStorage.setItem('temp_show_name', name);
        window.location.href = 'config.html';
    }

    function handleJoin() {
        const roomID = document.getElementById('join-id').value;
        const pin = document.getElementById('join-pin').value;
        const overlay = document.getElementById('auth-overlay');
        const errorMsg = document.getElementById('error-display');

        if (roomID.length < 4 || pin.length < 4) {
            triggerError('join-section');
            return;
        }

        // Tactical UI State
        overlay.classList.remove('hidden');
        errorMsg.classList.add('hidden');

        // Socket logic
        if (!socket) {
            socket = io(SERVER_URL);
        }

        socket.emit('join_room', { roomID, pin });

        socket.on('joined_success', (data) => {
            const session = {
                roomID: roomID,
                pin: pin,
                role: 'FOH', // Default protocol role
                timestamp: Date.now()
            };
            localStorage.setItem('av_comm_session', JSON.stringify(session));
            window.location.href = 'grid.html';
        });

        socket.on('error', (err) => {
            overlay.classList.add('hidden');
            errorMsg.classList.remove('hidden');
            triggerError('join-section');
        });

        // Connection timeout safety
        setTimeout(() => {
            if (!overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
                errorMsg.innerText = "TIMEOUT: SERVER_UNREACHABLE";
                errorMsg.classList.remove('hidden');
            }
        }, 5000);
    }

    function triggerError(elementId) {
        const el = document.getElementById(elementId);
        el.classList.add('border-red-500/50');
        setTimeout(() => el.classList.remove('border-red-500/50'), 1000);
    }
</script>
</body></html>
