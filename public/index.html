<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AV-COMM: Stage Tech Auth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "#00ff41",
              "on-surface": "#e5e2e1",
              "on-primary-fixed-variant": "#00530e",
              "outline-variant": "#3b4b37",
              "surface-container-highest": "#353534",
              "on-background": "#e5e2e1",
              "secondary-container": "#fd9000",
              "surface-variant": "#353534",
              "on-primary": "#003907",
              "surface-tint": "#00e639",
              "primary-fixed-dim": "#00e639",
              "surface-bright": "#393939",
              "error": "#ffb4ab",
              "surface-container-low": "#1c1b1b",
              "surface": "#131313",
              "primary-fixed": "#72ff70",
              "outline": "#84967e",
              "secondary": "#ffb778",
              "on-primary-container": "#007117",
              "primary": "#ebffe2",
              "surface-container": "#201f1f",
              "background": "#131313",
              "surface-container-lowest": "#0e0e0e",
              "surface-container-high": "#2a2a2a",
              "on-surface-variant": "#b9ccb2",
              "surface-dim": "#131313",
              "inverse-surface": "#e5e2e1",
              "secondary-fixed": "#ffdcc1"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #131313;
        color: #e5e2e1;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      .glitch-bg {
        background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .signal-steel-gradient {
        background: linear-gradient(180deg, #131313 0%, #0e0e0e 100%);
      }
      input:focus {
        outline: none !important;
        box-shadow: none !important;
      }
    </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container flex flex-col">
<!-- Header -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 bg-[#131313] border-b-2 border-[#00FF41]/30 flex-shrink-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00FF41]" data-icon="sensors">sensors</span>
<span class="text-[#00FF41] font-bold tracking-tighter font-headline uppercase text-sm">STAGE_TECH_AUTH</span>
</div>
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-[#00FF41] active:rotate-180 transition-transform duration-500 cursor-pointer" data-icon="sync" onclick="location.reload()">sync</span>
</div>
</header>
<!-- Main Content Container -->
<main class="flex-1 w-full flex flex-col md:flex-row items-stretch overflow-hidden glitch-bg" id="app-root">
<!-- CREATE NEW SHOW SECTION -->
<section class="flex-1 flex flex-col justify-center px-8 md:px-16 border-b-2 md:border-b-0 md:border-r-2 border-[#1c1b1b] relative">
<div class="mb-10">
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-primary-container"></div>
<span class="font-label text-xs font-black uppercase tracking-[0.2em] text-outline">PROTOCOL_01</span>
</div>
<h2 class="font-headline font-bold text-5xl md:text-7xl text-on-surface tracking-tighter leading-none uppercase">Create<br/>New Show</h2>
</div>
<div class="space-y-8 max-w-md w-full z-10">
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-on-surface-variant ml-1">Assign Show Name</label>
<input class="w-full bg-surface-container-highest border-none border-l-4 border-transparent focus:border-primary-fixed text-primary-container font-headline font-medium tracking-tight h-16 px-4 placeholder:text-outline-variant/30 uppercase text-lg transition-all" id="create-show-name" placeholder="E.G. NEON_SUMMIT_2024" type="text"/>
</div>
<button class="group/btn relative w-full h-20 bg-primary-container text-on-primary-container flex items-center justify-between px-6 rounded-sm active:scale-[0.98] transition-all hover:shadow-[0_0_30px_rgba(0,255,65,0.3)]" id="btn-create-show">
<span class="font-headline font-black text-2xl tracking-tighter">GENERATE SHOW ID</span>
<span class="material-symbols-outlined text-3xl group-hover/btn:translate-x-2 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none">01</span>
</div>
</section>
<!-- JOIN EXISTING SHOW SECTION -->
<section class="flex-1 flex flex-col justify-center px-8 md:px-16 bg-surface-container-lowest relative">
<div class="mb-10">
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 bg-secondary-container"></div>
<span class="font-label text-xs font-black uppercase tracking-[0.2em] text-outline">PROTOCOL_02</span>
</div>
<h2 class="font-headline font-bold text-5xl md:text-7xl text-on-surface tracking-tighter leading-none uppercase">Join<br/>Existing</h2>
</div>
<div class="space-y-8 max-w-md w-full z-10">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-on-surface-variant ml-1 uppercase">Show ID</label>
<input class="w-full bg-surface-container-high border-none border-l-4 border-transparent focus:border-secondary-fixed text-secondary text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-outline-variant/20 transition-all" id="join-show-id" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="0000" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label text-[10px] font-black uppercase tracking-widest text-on-surface-variant ml-1 uppercase">Access PIN</label>
<input class="w-full bg-surface-container-high border-none border-l-4 border-transparent focus:border-secondary-fixed text-secondary text-center text-3xl font-headline font-bold h-20 px-2 placeholder:text-outline-variant/20 transition-all" id="join-show-pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="****" type="password"/>
</div>
</div>
<button class="w-full h-20 bg-surface-container-high text-on-surface border-2 border-transparent hover:border-secondary-container flex items-center justify-center px-6 rounded-sm active:scale-[0.98] transition-all group/join" id="btn-join-show">
<span class="font-headline font-black text-2xl tracking-tighter uppercase group-hover/join:text-secondary transition-colors">INITIALIZE UPLINK</span>
</button>
</div>
<div class="absolute bottom-10 right-10 opacity-5 pointer-events-none select-none">
<span class="font-headline font-black text-[12rem] leading-none">02</span>
</div>
</section>
</main>
<!-- Mobile Nav Bar (Visual Only for Aesthetic Consistency) -->
<nav class="md:hidden flex-shrink-0 flex justify-around items-center px-4 pb-safe bg-[#0e0e0e] h-20 border-t-2 border-[#1c1b1b]">
<div class="flex flex-col items-center justify-center bg-[#00FF41] text-[#007117] rounded-sm px-6 py-2 shadow-[0_0_15px_rgba(0,255,65,0.4)] scale-90">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">CHANNELS</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">PTT</span>
</div>
<div class="flex flex-col items-center justify-center text-[#3b4b37] px-6 py-2">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-['Inter'] font-black uppercase text-[10px] tracking-tighter">MSGS</span>
</div>
</nav>
<script>
        // DOM Elements
        const btnCreate = document.getElementById('btn-create-show');
        const btnJoin = document.getElementById('btn-join-show');
        const createNameInput = document.getElementById('create-show-name');
        const joinIdInput = document.getElementById('join-show-id');
        const joinPinInput = document.getElementById('join-show-pin');

        // Action: Create Show
        btnCreate.addEventListener('click', () => {
            const name = createNameInput.value.trim() || 'UNNAMED_SHOW';
            
            // Store state and redirect
            localStorage.setItem('av_comm_show_name', name.toUpperCase());
            localStorage.setItem('av_comm_mode', 'creator');
            
            // Immediate redirection to config
            window.location.href = 'config.html';
        });

        // Action: Join Show
        btnJoin.addEventListener('click', () => {
            const showId = joinIdInput.value.trim();
            const pin = joinPinInput.value.trim();

            if (showId.length !== 4 || pin.length !== 4) {
                // Tactical UI Feedback instead of browser alert
                joinIdInput.classList.add('border-red-500');
                joinPinInput.classList.add('border-red-500');
                setTimeout(() => {
                    joinIdInput.classList.remove('border-red-500');
                    joinPinInput.classList.remove('border-red-500');
                }, 1000);
                return;
            }

            // Store state and redirect
            localStorage.setItem('av_comm_show_id', showId);
            localStorage.setItem('av_comm_pin', pin);
            localStorage.setItem('av_comm_mode', 'participant');
            
            // Immediate redirection to grid
            window.location.href = 'grid.html';
        });

        // Input Sanitization for Join fields (numeric only)
        [joinIdInput, joinPinInput].forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });

        // Handle 'Enter' key on inputs
        createNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnCreate.click();
        });
        joinPinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnJoin.click();
        });
    </script>
</body></html>
