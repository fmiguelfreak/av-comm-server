<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>STAGE_TECH_AUTH // INDEX</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00FF41",
              "on-primary": "#003907",
              "background": "#000000",
              "surface": "#0e0e0e",
              "surface-variant": "#1c1b1b",
              "outline": "#3b4b37",
              "error": "#FF3131"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { overflow: hidden; height: 100vh; background-color: #000; position: fixed; width: 100%; }
      .tactical-glow { box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
      .neon-border { border: 1px solid rgba(0, 255, 65, 0.3); }
      .neon-border:focus-within { border-color: #00FF41; box-shadow: 0 0 10px rgba(0, 255, 65, 0.3); }
      input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 99;
        background: linear-gradient(0deg, rgba(0, 255, 65, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 255, 65, 0) 100%);
        opacity: 0.1;
        position: fixed;
        bottom: 100%;
        animation: scanline 6s linear infinite;
        pointer-events: none;
      }
      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }
    </style>
</head>
<body class="bg-black text-primary font-body select-none">
<div class="scanline"></div>
<!-- Top Bar -->
<header class="fixed top-0 left-0 w-full h-16 bg-black border-b-2 border-surface-variant z-50 flex items-center justify-between px-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="security">security</span>
<h1 class="font-headline font-bold tracking-widest text-lg">STAGE_TECH_AUTH</h1>
</div>
<div class="flex items-center gap-4 opacity-70">
<span class="material-symbols-outlined text-sm animate-pulse" data-icon="sensors">sensors</span>
<span class="material-symbols-outlined text-sm" data-icon="sync">sync</span>
</div>
</header>
<main class="h-full pt-20 pb-24 px-6 flex flex-col justify-center max-w-md mx-auto space-y-8">
<!-- Protocol 01: Create -->
<section class="space-y-4" id="section-create">
<div class="flex items-center gap-2 border-l-2 border-primary pl-3">
<span class="font-headline font-bold text-xs tracking-tighter opacity-50">PROTOCOL_01</span>
<h2 class="font-headline font-black text-xl uppercase tracking-tight">Create New Show</h2>
</div>
<div class="space-y-3 bg-surface p-4 rounded-sm border border-surface-variant relative overflow-hidden">
<div class="space-y-1">
<label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Show Name</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline uppercase font-headline font-bold" id="create-name" placeholder="ENTER SHOW NAME" type="text"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline font-black py-4 mt-2 tactical-glow active:scale-[0.98] transition-all uppercase text-sm tracking-widest flex items-center justify-center gap-2" onclick="window.location.href='config.html'">
                    Generate Show ID
                    <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
</div>
</section>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="mx-4 text-[10px] font-black opacity-30 tracking-[0.5em]">SYSTEM_OR</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Protocol 02: Join -->
<section class="space-y-4" id="section-join">
<div class="flex items-center gap-2 border-l-2 border-primary pl-3">
<span class="font-headline font-bold text-xs tracking-tighter opacity-50">PROTOCOL_02</span>
<h2 class="font-headline font-black text-xl uppercase tracking-tight">Join Existing</h2>
</div>
<div class="space-y-3 bg-surface p-4 rounded-sm border border-surface-variant" id="join-container">
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1">
<label class="text-[10px] font-bold uppercase tracking-widest opacity-60">Show ID</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline text-center text-xl font-headline font-bold tracking-[0.2em]" maxlength="4" placeholder="0000" type="number"/>
</div>
</div>
<div class="space-y-1">
<label class="text-[10px] font-bold uppercase tracking-widest opacity-60">PIN</label>
<div class="neon-border bg-black flex items-center p-3">
<input class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline text-center text-xl font-headline font-bold tracking-[0.2em]" maxlength="4" placeholder="****" type="number"/>
</div>
</div>
</div>
<button class="w-full bg-surface-variant text-primary border border-primary/30 font-headline font-black py-4 mt-2 active:scale-[0.98] transition-all uppercase text-sm tracking-widest flex items-center justify-center gap-2" onclick="window.location.href='grid.html'">
                    Authorize Join
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-black border-t-2 border-surface-variant flex items-center justify-around px-2 z-50">
<div class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-sm p-3 w-14">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors p-3 w-14">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors p-3 w-14">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors p-3 w-14">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
</nav>
<!-- System Metadata -->
<div class="fixed bottom-24 right-4 flex flex-col items-end pointer-events-none opacity-40 select-none">
<span class="font-headline text-[8px] tracking-tighter text-primary">OS: VER_9.4.2</span>
<span class="font-headline text-[8px] tracking-tighter text-primary">SESSION: ACT_881</span>
</div>
</body></html>
