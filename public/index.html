<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
        // Socket.io initialization
        const socket = io('https://av-comm-server-production.up.railway.app');

        // DOM Elements
        const btnCreate = document.getElementById('btn-create-show');
        const btnJoin = document.getElementById('btn-join-show');
        const createNameInput = document.getElementById('create-show-name');
        const joinIdInput = document.getElementById('join-show-id');
        const joinPinInput = document.getElementById('join-show-pin');
        const appRoot = document.getElementById('app-root');

        // Socket connection log
        socket.on('connect', () => {
            console.log('Uplink synchronized:', socket.id);
        });

        // Event Handlers for UI Transitions
        function transitionToConfig(showData) {
            console.log('Redirecting to configuration view:', showData);
            // Save show data to localStorage for retrieval on the next page
            localStorage.setItem('av_comm_show_id', showData.showId);
            localStorage.setItem('av_comm_pin', showData.pin);
            localStorage.setItem('av_comm_show_name', showData.name);
            
            // Redirect to config.html
            window.location.href = 'config.html';
        }

        // Action: Create Show
        btnCreate.addEventListener('click', () => {
            const name = createNameInput.value.trim() || 'UNNAMED_SHOW';
            btnCreate.disabled = true;
            btnCreate.innerText = 'INITIALIZING...';

            socket.emit('create_show', { name: name });
        });

        // Action: Join Show
        btnJoin.addEventListener('click', () => {
            const showId = joinIdInput.value.trim();
            const pin = joinPinInput.value.trim();

            if (showId.length !== 4 || pin.length !== 4) {
                alert('PROTOCOL ERROR: Show ID and PIN must be 4 digits.');
                return;
            }

            btnJoin.disabled = true;
            btnJoin.innerText = 'AUTHENTICATING...';
            
            socket.emit('join_show', { showId, pin });
        });

        // Socket Listeners
        socket.on('show_created', (data) => {
            // Data expected: { showId, pin, name }
            transitionToConfig(data);
        });

        socket.on('join_success', (data) => {
            // Data expected: { showId, pin, name }
            alert('UPLINK ESTABLISHED. ACCESS GRANTED.');
            transitionToConfig(data);
        });

        socket.on('error', (err) => {
            alert(`UPLINK FAILED: ${err.message || 'Unknown protocol error'}`);
            btnCreate.disabled = false;
            btnJoin.disabled = false;
            btnCreate.innerHTML = '<span class="font-headline font-black text-2xl tracking-tighter">GENERATE SHOW ID</span><span class="material-symbols-outlined text-3xl group-hover/btn:translate-x-2 transition-transform" data-icon="arrow_forward">arrow_forward</span>';
            btnJoin.innerText = 'INITIALIZE UPLINK';
        });

        // Input Sanitization
        [joinIdInput, joinPinInput].forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });
    </script>
