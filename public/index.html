<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV-COMM</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body style="background:#111;color:white;font-family:sans-serif;text-align:center;padding:40px">

<h1>AV-COMM</h1>

<button id="createBtn">CRIAR SALA</button>

<br><br>

<input id="room" placeholder="ROOM ID">
<input id="pin" placeholder="PIN">
<button id="joinBtn">ENTRAR</button>

<script>
const socket = io();

document.getElementById('createBtn').onclick = () => {
    socket.emit('create_room', { channels: 12 });
};

document.getElementById('joinBtn').onclick = () => {
    const roomID = document.getElementById('room').value;
    const pin = document.getElementById('pin').value;

    socket.emit('join_room', { roomID, pin, role: "CLIENT" });
};

// CREATE RESPONSE
socket.on('room_created', (data) => {
    localStorage.setItem('av_session', JSON.stringify(data));
    window.location.href = 'config.html';
});

// JOIN RESPONSE
socket.on('joined_success', (data) => {
    localStorage.setItem('av_session', JSON.stringify(data));
    window.location.href = 'grid.html';
});

socket.on('error_msg', (msg) => {
    alert(msg);
});
</script>

</body>
</html>
